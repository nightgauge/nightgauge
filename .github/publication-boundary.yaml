# ─── Unresolvable issue references (#673) ────────────────────────────────────
# This tree was imported from a predecessor repository whose issue numbers came
# with it. Roughly 6,800 `#N` citations in production and documentation name
# numbers this repository has never issued, across ~1,021 files. Today most of
# them 404, which is annoying but self-announcing. As this repository's own
# numbering climbs past them they stop 404-ing and start resolving -- silently,
# confidently -- to unrelated live work. That is strictly worse than a dead
# link, and it is already happening: a `@see Issue #699` comment in
# HeadlessOrchestrator.ts now points at a real, unrelated issue.
#
# THE RULE IS A DEFINITION, NOT A HEURISTIC. A reference to a number above the
# number this repository has actually issued cannot resolve at the moment it is
# written. That statement holds at every repository size, so the rule does not
# need revisiting when this repository passes four digits -- which is precisely
# the failure mode a `#\d{4,}` regex would have. Digit count is the wrong axis
# in both directions: 951 distinct unresolvable numbers here are BELOW 1000, and
# `#000000` / `&#8635;` are six digits and are not references at all.
#
# SCOPE: newly ADDED lines, measured against the pull request's base. The rule
# is "no newly introduced unresolvable reference", so a diff is its honest
# scope; the ~6,800 legacy occurrences are a separate mechanical sweep that has
# to land alone over settled code. Gating the whole tree here would mean
# shipping the sweep before the guard, which is the ordering that let the
# problem accumulate.
#
# CEILING: the derived mark + slack. `slack` covers numbers this repository
# issues while a pull request is open, which the mark cannot see because it is
# read from what has already MERGED.
#
# THE MARK IS DERIVED, NOT RECORDED (#1078). GitHub appends `(#N)` to the
# subject when it squash-merges a pull request, so the TRAILING marker on the
# first-parent history is the number the forge issued. The guard reads it from
# `git log` -- offline, no network call, nothing to bump.
#
# Only the trailing marker counts, which is what keeps the derivation from being
# author-controlled: a pull request titled `feat: thing (#99999)` squash-merges
# to `feat: thing (#99999) (#1080)` and reads 1080. An unanchored search would
# take the bait and let a crafted title raise the ceiling.
#
# This replaced a hand-maintained `high_water_mark` that cost 21 chore commits
# and failed CLOSED every time it fell behind -- turning `main` red rather than
# degrading. The guarantee is unchanged; the counter nobody watched is gone.
#
# NOT MATCHED, on purpose:
#   * `owner/repo#N` for any other repository -- those numbers belong to a
#     sequence this manifest knows nothing about. `google-gemini/gemini-cli#17081`
#     and `microsoft/vscode#322741` are live, correct citations. The private
#     `nightgauge-*` forms are covered by `private-repository-issue-reference`.
#   * `&#8635;` and friends -- HTML numeric entities, not references.
#   * `#5865f2` -- a hex colour whose digit head a naive regex reads as `#5865`.
#   * `#252526`, `#101830` -- all-digit hex colours. Six and eight digit widths
#     are excluded by width; this repository is ~140x away from being able to
#     issue such a number.
#   * `#0000ff`, `#000000` -- zero-padded, and GitHub issues no such number.
#   * anything under `allow_paths` below.
issue_references:
  # Numbers that may be issued while a pull request is open -- the derived mark
  # is a lower bound, since it can only see what has already MERGED. Deliberately
  # tight:
  # the whole point of #673 is that the margin between a dead reference and a
  # wrong live one is a handful of issue numbers, and a generous slack reopens
  # exactly that hole.
  slack: 25
  # Tree-wide burn-down ratchet. The count of unresolvable references in the
  # TRACKED TREE may only go DOWN; the guard fails when it rises and tells you
  # to lower this number when it falls.
  #
  # This is what lets the guard ship before the sweep rather than after -- the
  # ordering the checker's module header correctly refuses to invert. Until this
  # key existed the tree-wide count had never been measured: the rule was
  # diff-scoped, and docs/ADAPTER_MATRIX.md carried `#2595` against a
  # high-water mark of 789 while the guard printed "clean".
  #
  # 2026-08-23: first measurement, 6,257 references across 997 files.
  # 2026-08-23: 6,255 after R.1 (#836) dropped two archived-repo citations that
  # a file rename made newly visible to the diff-scoped rule.
  # 2026-08-24: 6,194 after the session's merges retired further citations.
  # 2026-08-25: 6,175 — measured on a settled tree after the session-4 merges
  # landed, and with high_water_mark already at 913: the two numbers interact,
  # since raising the mark resolves references that were counted here.
  # Re-measure AFTER bumping the mark, never before.
  # 2026-08-25 (session 6): 6,144 — measured after bumping the mark to 922,
  # which by itself resolved 31 references that 913 had left dangling. Same
  # lesson as the line above, now with a number attached: the bump is not a
  # separate chore from the re-measure, it is the first half of it.
  # 2026-08-26 (#971): 6,060 — the ADAPTER_MATRIX.md correction retired three
  # citations along with the dead capability audit and the two refuted gaps.
  # 2026-08-26 (session 13): 6,036 — the #970/#971/#978 deletions retired some,
  # and raising high_water_mark to 981 resolved the rest. Measured from this
  # script's own output AFTER the raise, not carried forward: the two halves are
  # one operation, because the bump itself changes what resolves.
  # 2026-08-28 (session 18): 5,807 — measured after raising the mark to 1076,
  # which resolved the epic #1052 citations that 1058 had left dangling.
  # 2026-08-28 (#1078): 5,801 — the mark became derived rather than recorded, so
  # it now tracks the newest merged number automatically. This is the last
  # re-measure that follows a manual bump; from here the count moves only when
  # references are actually written or retired.
  # 2026-08-28 (#1078, same day): 5,796 — and this fall is NOT progress. The
  # mark now rises on its own, so references stop being counted here the moment
  # the repository issues a number past them. They were not fixed; they crossed
  # the ceiling and became live links to unrelated work, which is the exact
  # hazard the rule exists to prevent. A falling count is therefore ambiguous:
  # part sweep, part erosion. Tracked separately — do not read this number as a
  # measure of the sweep on its own.
  # 2026-08-28 (post-#1070): 5,774 — measured on a settled tree after the Slack
  # epic merged. The fall is the ambiguous kind described directly above: the
  # Slack work wrote no new citations, so this is the derived mark rising past
  # references rather than a sweep retiring them. Recorded to keep the ratchet
  # tight, not claimed as progress.
  # 2026-08-29 (#1129): STOP HAND-JUDGING FALLS. The two entries above call a
  # fall "ambiguous" and then ratchet it anyway; doing that once broke the next
  # branch, which measured the identical tree at its own lower ceiling and was
  # rejected by 13 references it had never touched. Two facts make the manual
  # judgement unsafe rather than merely imprecise:
  #
  #   * the count is a function of the CEILING -- a lower ceiling leaves more
  #     numbers above it and so measures MORE -- while this baseline is one
  #     global integer shared by every branch; and
  #   * a branch's ceiling is derived from FIRST-PARENT history, and merging
  #     `main` in does not advance it (the merge is the second parent). Since
  #     AGENTS.md forbids force-push and rebase, that is the only permitted way
  #     to update a branch, so a long-lived branch always measures low-ceiling.
  #
  # The checker now decides instead of asking. It takes the larger of the
  # branch's and the base ref's marks, and it advises a lowering only for the
  # part of a fall it can attribute to references genuinely removed -- measuring
  # both sides at one ceiling. When it prints "Do NOT lower", do not lower.
  #
  # 2026-08-29 (#1080): 5,770 — and this one IS four references, named. The
  # checker measured the tree at 5,687 and refused 83 of the 87-point fall as
  # erosion, offering 5,770; that is what is recorded. The four are `#1608` in
  # AGENTS.md (de-linked to `legacy issue 1608`) and three `docs/spikes/`
  # citations qualified to `owner/repo#N`. They are listed by path and number in
  # the run's own `retired:` lines, which is the point of #1080: a fall is now
  # itemised instead of argued about.
  #
  # NEVER raise this number. Lower it ONLY to the value the checker names.
  tree_baseline: 5768
  allow_paths:
    # Files that DEFINE or TEST the rule must contain example violations.
    - ".github/publication-boundary.yaml"
    - "scripts/publication-boundary-check.py"
    - "scripts/test-publication-boundary.sh"
    - "scripts/test-publication-boundary-rename.py"
    - "scripts/test-publication-boundary-ceiling.py"
    # Synthetic test identifiers are not citations. `#700` in a table-driven Go
    # test or a snapshot fixture is an arbitrary key chosen to be out of range;
    # denying it would make the rule unusable, and rewriting it in the sweep
    # would be wrong. Accepted trade-off: a genuine citation written in a test
    # file is not checked.
    - "**/*_test.go"
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/*.test.js"
    - "**/*.test.mjs"
    - "**/*.test.cjs"
    - "**/*.spec.ts"
    - "**/*.spec.js"
    - "**/*.snap"
    - "**/tests/**"
    - "**/test/**"
    - "**/__tests__/**"
    - "**/__snapshots__/**"
    - "**/testdata/**"
    - "**/fixtures/**"

