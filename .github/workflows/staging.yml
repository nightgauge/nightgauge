# Staging — RC dry-run. Validates the FULL release build WITHOUT publishing.
#
# Triggered by pre-release semver tags (vX.Y.Z-rc.N). Produces the real
# artifacts — one platform-specific .vsix per target plus the GoReleaser CLI
# binaries/tarballs — as downloadable Actions artifacts, so every public install
# path can be verified BEFORE a real release. Publishes NOTHING: no Marketplace,
# no Homebrew push, no GitHub Release. Promote a green RC to a real release by
# tagging the same commit vX.Y.Z (→ release.yml).
name: Staging (RC dry-run)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

env:
  TZ: UTC

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Build all artifacts (no publish)
    # macos-latest, not ubuntu: Apple `codesign` runs only on macOS, and the
    # rc channel is where signing is proved before release.yml adopts it.
    # macOS still cross-compiles linux/amd64 (CGO_ENABLED=0).
    #
    # COST: free only because this repository is PUBLIC and this is a STANDARD
    # runner. Verified, not assumed -- the timing API reports MACOS total_ms 0
    # for a 271s job (`gh api repos/.../actions/runs/<id>/timing`). Two things
    # would change that: making the repository private, where macOS bills at
    # 10x the Linux rate against included minutes, or switching to a larger
    # runner such as macos-14-xlarge, which is billed even on public repos.
    # Do not copy this pattern into a private repository without re-checking.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Configure git identity
        # Repository-scoped, not --global: nothing outside this checkout needs
        # an identity, and a global one leaks into every other git call on the
        # runner.
        run: |
          git config user.email "ci@nightgauge.dev"
          git config user.name "Nightgauge CI"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "RC dry-run: $TAG"

      - name: Install dependencies
        run: npm ci

      - name: Build all Go binaries (per-target VSIX bundling)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make build-all VERSION="$VERSION"

      # Sign before anything packages these binaries. The VSIX freezes whatever
      # is in dist/bin/, so signing afterwards would ship an unsigned copy while
      # reporting success. No-ops with a notice when the Apple secrets are
      # absent, so a fork or a secretless re-run still completes.
      - name: Sign the macOS binaries
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          bash scripts/sign-macos-binaries.sh \
            bin/nightgauge-darwin-arm64 bin/nightgauge-darwin-amd64

      - name: Build SDK + extension
        run: npm run build

      - name: Inject RC version
        working-directory: packages/nightgauge-vscode
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Stamp build provenance
        env:
          BUILD_BRANCH: ${{ github.ref_name }}
        run: |
          DIST=packages/nightgauge-vscode/dist
          cat > "$DIST/build-info.json" <<EOF
          {
            "commitSha": "$(git rev-parse HEAD)",
            "branch": "$BUILD_BRANCH",
            "commitTimestamp": "$(git log -1 --format=%cI HEAD)",
            "buildTimestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "schemaVersion": "1"
          }
          EOF
          bash packages/nightgauge-vscode/scripts/check-build-info.sh "$DIST/build-info.json"

      # One .vsix per VS Code target, each bundling the matching binary. Mirrors
      # release.yml so the RC validates exactly what a real release produces.
      - name: Package per-target VSIXs
        working-directory: packages/nightgauge-vscode
        run: |
          set -euo pipefail
          # vsce target -> Makefile binary suffix, as a case rather than an
          # associative array. `declare -A` needs bash 4, and macOS ships bash
          # 3.2 for licensing reasons, so the array silently mangles into an
          # unbound variable there. Keeping this portable means the same step
          # runs on ubuntu and on the macos runner that codesigning requires.
          bin_suffix() {
            case "$1" in
              darwin-arm64) echo darwin-arm64 ;;
              darwin-x64)   echo darwin-amd64 ;;
              linux-x64)    echo linux-amd64 ;;
              *) echo "unknown target $1" >&2; return 1 ;;
            esac
          }
          # vsce records the pre-release flag in the VSIX manifest at PACKAGE
          # time; `publish --pre-release` on a VSIX packaged without it is
          # refused (#1299). Package the RC as its eventual release will ship.
          VERSION="$(node -p "require('./package.json').version")"
          CHANNEL=()
          CHANNEL_NAME="$(bash "$GITHUB_WORKSPACE/scripts/marketplace-channel.sh" "$VERSION")"
          if [[ "$CHANNEL_NAME" == "pre-release" ]]; then
            CHANNEL=(--pre-release)
            echo "Version $VERSION → packaging as pre-release"
          else
            echo "Version $VERSION → packaging as release"
          fi
          mkdir -p dist/bin
          for T in darwin-arm64 darwin-x64 linux-x64; do
            SRC="../../bin/nightgauge-$(bin_suffix "$T")"
            [[ -f "$SRC" ]] || { echo "ERROR: missing $SRC (did 'make build-all' run?)"; exit 1; }
            cp "$SRC" dist/bin/nightgauge
            chmod +x dist/bin/nightgauge
            npx @vscode/vsce@3.9.2 package --no-dependencies --target "$T" ${CHANNEL[@]+"${CHANNEL[@]}"}
          done
          echo "Packaged:"; ls -1 *.vsix

      # Every .vsix must carry the build-info stamp AND a bundled binary, and
      # must NOT ship source maps or type declarations (.vscodeignore drift).
      - name: Verify VSIX contents
        working-directory: packages/nightgauge-vscode
        env:
          # Non-empty only when a signing certificate is configured, so the
          # assertion below is strict on a real rc and informational on a fork.
          APPLE_SIGNING_EXPECTED: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          COUNT=0
          for VSIX in *.vsix; do
            COUNT=$((COUNT + 1))
            unzip -l "$VSIX" | grep -q 'extension/dist/build-info.json' \
              || { echo "ERROR: $VSIX missing build-info.json"; exit 1; }
            unzip -l "$VSIX" | grep -q 'extension/dist/bin/nightgauge' \
              || { echo "ERROR: $VSIX missing bundled Go binary"; exit 1; }
            unzip -l "$VSIX" | grep -q 'extension/dist/sdk-cli.cjs' \
              || { echo "ERROR: $VSIX missing bundled SDK CLI"; exit 1; }
            if unzip -l "$VSIX" | grep -qE '\.(map|d\.ts)$'; then echo "ERROR: $VSIX ships source maps or type declarations"; exit 1; fi

            # Assert the PACKAGED binary is Developer ID signed, not the one the
            # signing step happened to touch. The VSIX freezes a copy, so this
            # is the only check that speaks for what a user actually installs --
            # and the 0.4.2 Open VSX publish is the standing reminder that a
            # step's own success line is not evidence.
            case "$VSIX" in
              *darwin*)
                unzip -p "$VSIX" extension/dist/bin/nightgauge > "$RUNNER_TEMP/packaged-bin"
                if [[ -n "${APPLE_SIGNING_EXPECTED:-}" ]]; then
                  codesign -dvvv "$RUNNER_TEMP/packaged-bin" 2>&1 \
                    | grep -q 'Authority=Developer ID Application' \
                    || { echo "ERROR: $VSIX ships a binary that is not Developer ID signed"; exit 1; }
                  codesign -dv "$RUNNER_TEMP/packaged-bin" 2>&1 | grep -q 'flags=0x10000(runtime)' \
                    || { echo "ERROR: $VSIX binary lacks the hardened runtime"; exit 1; }
                  echo "OK: $VSIX carries a Developer ID signature with hardened runtime"
                else
                  codesign -dv "$RUNNER_TEMP/packaged-bin" 2>&1 | grep -q 'adhoc' \
                    && echo "NOTE: $VSIX binary is ad-hoc signed (no Apple secrets configured)"
                fi
                rm -f "$RUNNER_TEMP/packaged-bin"
                ;;
            esac
            echo "OK: $VSIX"
          done
          [[ "$COUNT" -eq 3 ]] || { echo "ERROR: expected 3 VSIXs, found $COUNT"; exit 1; }

      # The RC is the build a release is promoted FROM, so it is the one most
      # worth scanning -- catching a problem here costs a retag, catching it
      # after publish costs a withdrawal. release.yml and marketplace-publish.yml
      # run this same script; without it here the dry-run was the one release
      # path that did not exercise the gate.
      #
      # Not the exit code alone: clamscan exits 0 both for a clean artifact and
      # for one it never read. See scripts/malware-scan.sh.
      - name: Malware scan (ClamAV)
        run: |
          set -euo pipefail
          brew install --quiet clamav
          CLAMETC="$(brew --prefix)/etc/clamav"
          mkdir -p "$CLAMETC" "$(brew --prefix)/var/lib/clamav"
          sed 's/^Example/#Example/' "$CLAMETC/freshclam.conf.sample" > "$CLAMETC/freshclam.conf"
          freshclam --quiet
          bash scripts/malware-scan.sh \
            --report "$RUNNER_TEMP/clamav-report.json" \
            packages/nightgauge-vscode/*.vsix bin/

      - name: Upload malware scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clamav-scan-report-rc
          path: ${{ runner.temp }}/clamav-report.json
          if-no-files-found: warn

      # syft powers the `sboms:` block in .goreleaser.yml. The RC dry-run must
      # exercise the exact same SBOM path as the real release, so install syft
      # (SHA-pinned) here too.
      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # THIRD_PARTY_NOTICES is listed in .goreleaser.yml archives.files; ensure it
      # exists at repo root before the snapshot archive step (idempotent).
      - name: Ensure THIRD_PARTY_NOTICES for archives
        run: npm run notices

      # Snapshot mode: builds the CLI binaries + tarballs + checksums into dist/
      # but publishes nothing and pushes no Homebrew cask.
      - name: GoReleaser (snapshot — build only, no publish)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --snapshot --clean
        env:
          # Same pin as release.yml (#1296): name the snapshot after the tag
          # that triggered the run, not the highest tag on the commit.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Add VSIX checksums
        run: |
          set -euo pipefail
          for vsix in packages/nightgauge-vscode/*.vsix; do
            sha256sum "$vsix" | sed 's#  packages/nightgauge-vscode/#  #'
          done >> dist/checksums.txt
          sort -k2,2 -o dist/checksums.txt dist/checksums.txt

      # Exercise the same manifest path the real release uses. checksums.txt
      # covers both GoReleaser outputs and target-specific VSIX packages;
      # manifest.json is intentionally limited to CLI archives consumed by the
      # SDK postinstall downloader.
      - name: Generate manifest.json
        run: |
          set -euo pipefail
          python3 scripts/generate-manifest.py dist/ > dist/manifest.json
          test -s dist/manifest.json || { echo "ERROR: empty manifest.json"; exit 1; }
          echo "manifest.json:"; head -c 400 dist/manifest.json; echo

      - name: Upload RC artifacts for manual verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-artifacts-${{ steps.version.outputs.tag }}
          path: |
            packages/nightgauge-vscode/*.vsix
            dist/*.tar.gz
            dist/checksums.txt
            dist/manifest.json
            dist/*.spdx.sbom.json
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "### RC dry-run $TAG — no publish" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **rc-artifacts-$TAG** from this run to install/test each platform's .vsix and the CLI tarballs." >> "$GITHUB_STEP_SUMMARY"
