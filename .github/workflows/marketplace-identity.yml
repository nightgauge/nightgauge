# Marketplace Identity — resolve the publishing identity's Azure DevOps profile
#
# Run this once, manually, while wiring up Marketplace publishing:
#
#   gh workflow run marketplace-identity.yml
#
# It does two jobs at once.
#
# 1. It proves the federated credential works. If `azure/login` succeeds here,
#    the same OIDC exchange will succeed in release.yml — the subject claim is
#    identical because both jobs use `environment: production`. Discovering a
#    broken credential here costs one manual run; discovering it during a
#    release costs a half-published release.
#
# 2. It prints the identity's Azure DevOps profile ID. Azure DevOps maintains
#    its own identity record, separate from BOTH the managed identity's ARM
#    resource ID and its Entra object ID. The Marketplace publisher membership
#    page accepts only that third ID, and it can only be read by a caller
#    authenticated AS the identity — which is why this cannot be done from a
#    laptop with `az login`. Most failed attempts at this setup are someone
#    pasting the resource ID or the object ID into that page.
#
# Publishes NOTHING. Requires the AZURE_CLIENT_ID and AZURE_TENANT_ID secrets
# written by scripts/setup-marketplace-identity.sh.

name: Marketplace Identity

on:
  workflow_dispatch:

jobs:
  resolve-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # MUST match release.yml's publishing job: the federated credential is
    # scoped to `repo:nightgauge/nightgauge:environment:production`, so a
    # different environment here would test a subject claim that release.yml
    # never presents.
    environment: production

    permissions:
      id-token: write # OIDC token for the federated credential exchange
      contents: read

    steps:
      - name: Sign in to Azure via OIDC
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # The identity needs no role assignment on any subscription — it only
          # ever calls Azure DevOps and the Marketplace. Without this, login
          # fails looking for a subscription it does not need.
          allow-no-subscriptions: true

      - name: Resolve Azure DevOps profile ID
        run: |
          set -euo pipefail
          # 499b84ac-1321-427f-aa17-267ca6975798 is the fixed Azure DevOps
          # resource ID; the token must be issued for it, not for ARM.
          PROFILE="$(az rest \
            --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798)"

          PROFILE_ID="$(printf '%s' "$PROFILE" | jq -r '.id // empty')"
          if [ -z "$PROFILE_ID" ]; then
            echo "::error::Azure DevOps returned no profile id. Raw response:"
            printf '%s\n' "$PROFILE"
            exit 1
          fi

          echo "Azure DevOps profile ID: $PROFILE_ID"
          {
            echo "### Marketplace publisher member ID"
            echo
            echo '```'
            echo "$PROFILE_ID"
            echo '```'
            echo
            echo "Add this as a member of the \`nightgauge\` publisher with the"
            echo "**Contributor** role:"
            echo
            echo "https://marketplace.visualstudio.com/manage/publishers/nightgauge"
            echo
            echo "Do not paste the ARM resource ID or the Entra object ID — the"
            echo "Marketplace rejects both."
          } >> "$GITHUB_STEP_SUMMARY"
