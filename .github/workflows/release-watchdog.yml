name: Release Watchdog

# Daily detection of upstream Claude Code releases, and the producer of
# `.nightgauge/release-watch/creation-log-<provider>.json` — the file the
# VSCode dashboard's Discovery tab reads.
#
# The tab, DiscoveryActivityService, its unit tests and
# docs/SCHEDULED_DISCOVERY.md all shipped describing this workflow in the
# present tense. The workflow itself was never written (#753), so the tab read
# a path nothing produced and rendered "No discovery activity yet" forever.
# This is the missing producer.
#
# Shape of a run:
#
#   gate     Resolve autonomous_discovery.{enabled,kill_switch,score_threshold}
#            and scheduled_tasks.release_watch.enabled out of
#            .nightgauge/config.yaml. Fails closed — see
#            scripts/discovery-config-gate.py.
#
#   analyze  Detect deterministically (`nightgauge release fetch`, no model),
#            then optionally assess with the release-watch skill. READ-ONLY:
#            `contents: read`, no forge token in the model's environment, and
#            the only thing it hands on is one JSON proposal artifact.
#
#   apply    Model-free. Holds the write scopes, downloads the artifact,
#            validates it against a closed schema
#            (scripts/validate-proposal-artifact.mjs), and only then files
#            issues, advances last-seen, and ALWAYS closes a run record so the
#            tab can tell "ran and found nothing" apart from "never ran".
#
# WHY TWO JOBS. The skill reads release notes from a third-party repository
# and runs with Bash. One job that held `contents: write`, `issues: write` and
# a GH_TOKEN while doing that was a prompt-injection-to-write path: a crafted
# release note could have pushed state or filed anything (#1304). The model
# now runs where there is nothing to write with, and everything it produces
# passes through the validator before a token is anywhere near it.
#
# The state files are published to the `discovery-state` branch, not to `main`:
# `main`'s ruleset requires a pull request, so no workflow token can push to
# it. The full reasoning, and the developer-side fetch, are in
# scripts/discovery-state-sync.sh.

on:
  schedule:
    # Daily at 9 AM UTC — the cadence docs/SCHEDULED_DISCOVERY.md documents.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider slug (selects last-seen state, label, tracker)"
        required: false
        default: "claude-code"
      source:
        description: "owner/repo whose releases are polled"
        required: false
        default: "anthropics/claude-code"
      since:
        description: "Override the last-seen version (semver, no leading v)"
        required: false
        default: ""
      dry_run:
        description: "Detect and report without creating issues or advancing last-seen"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # No cancel-in-progress: two runs racing on the `discovery-state` branch is
  # the only real hazard here, and cancelling a run that has already filed
  # issues but not yet closed its record would leave the tab showing a
  # permanently "running" run.
  group: release-watchdog
  cancel-in-progress: false

env:
  TZ: UTC

jobs:
  gate:
    name: Resolve the autonomous_discovery switches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      create_issues: ${{ steps.gate.outputs.create_issues }}
      score_threshold: ${{ steps.gate.outputs.score_threshold }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate dispatch inputs
        # Every downstream job binds these through env (never interpolated),
        # so they are data, not code -- but `provider` becomes a path segment
        # and `source` reaches the forge CLI, so reject anything outside the
        # shapes they are meant to hold before any job spends a runner on it.
        env:
          PROVIDER: ${{ inputs.provider || 'claude-code' }}
          SOURCE: ${{ inputs.source || 'anthropics/claude-code' }}
          SINCE_OVERRIDE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          [[ "$PROVIDER" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]] || { echo "::error::provider must be a lowercase slug, got '$PROVIDER'"; exit 1; }
          [[ "$SOURCE" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::source must be owner/repo, got '$SOURCE'"; exit 1; }
          [[ -z "$SINCE_OVERRIDE" || "$SINCE_OVERRIDE" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "::error::since must be a bare semver (no leading v), got '$SINCE_OVERRIDE'"; exit 1; }

      - name: Install the gate's pinned parser dependency
        # Hosted runner images do not promise PyYAML, and the gate fails closed
        # if it cannot parse the config — so an unpinned import error would
        # silently mean "never run" rather than "run with defaults".
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r .github/requirements-ci.txt

      - name: Read .nightgauge/config.yaml
        id: gate
        run: python3 scripts/discovery-config-gate.py --task release_watch

      - name: Explain a skipped run in the job summary
        if: ${{ steps.gate.outputs.enabled != 'true' }}
        env:
          GATE_REASON: ${{ steps.gate.outputs.reason }}
        run: |
          {
            echo "### Release watchdog skipped"
            echo
            echo "\`$GATE_REASON\`"
            echo
            echo "Set \`autonomous_discovery.enabled\` and"
            echo "\`scheduled_tasks.release_watch.enabled\` in \`.nightgauge/config.yaml\`."
          } >> "$GITHUB_STEP_SUMMARY"

  analyze:
    name: Detect and assess (read-only)
    needs: gate
    if: ${{ needs.gate.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Read-only by construction. The model runs in this job, so nothing here
      # may be able to write to the forge: no `issues: write`, no
      # `contents: write`, and — below — no token in the model step's env.
      contents: read
    outputs:
      since: ${{ steps.detect.outputs.since }}
      count: ${{ steps.detect.outputs.count }}
      new_version: ${{ steps.detect.outputs.new_version }}
      detect_outcome: ${{ steps.detect.outcome }}
      assess_outcome: ${{ steps.assess.outcome }}
    env:
      # Every dispatch input is bound to an env var and referenced as "$VAR"
      # inside `run:`, never interpolated into the script text. Interpolation
      # splices the value into the shell source before bash ever sees it, so a
      # crafted input becomes a command; an env var is data whatever it holds.
      PROVIDER: ${{ inputs.provider || 'claude-code' }}
      SOURCE: ${{ inputs.source || 'anthropics/claude-code' }}
      SINCE_OVERRIDE: ${{ inputs.since }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      SCORE_THRESHOLD: ${{ needs.gate.outputs.score_threshold }}
      # `secrets` is not one of the contexts available to a step-level `if:`,
      # so the key's presence is resolved here, where it is.
      HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job token in .git/config where a Bash-equipped
          # model could reuse it. The token is read-only here anyway; this
          # makes "no forge credential reachable from the model" literally
          # true rather than merely scoped.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build the nightgauge binary
        # Detection is deterministic and model-free: `release fetch` and
        # `release classify-changes` are Go verbs (internal/cmd/release). Only
        # relevance scoring and issue authoring need a model, which is why a
        # run without ANTHROPIC_API_KEY still produces a usable record.
        run: go build -o bin/nightgauge ./cmd/nightgauge

      - name: Carry forward the previous run's state
        # last-seen-<provider>.json lives on the state branch, not in the
        # source tree. Without this the runner starts from 0.0.0 every day and
        # re-detects every release it has already seen. The fetch is
        # unauthenticated (public repository) — see persist-credentials above.
        run: bash scripts/discovery-state-sync.sh

      - name: Detect a new upstream release
        id: detect
        run: |
          set -euo pipefail
          LAST_SEEN=".nightgauge/release-watch/last-seen-${PROVIDER}.json"
          SINCE="$SINCE_OVERRIDE"
          if [ -z "$SINCE" ] && [ -f "$LAST_SEEN" ]; then
            SINCE="$(jq -r '.version // ""' "$LAST_SEEN")"
          fi
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"

          # $RUNNER_TEMP, not the checkout: discovery-state-publish.sh only
          # collects .nightgauge/*, but a stray releases.json in the working
          # tree is exactly the "pipeline exhaust" that makes a later `git
          # status` read as uncommitted work.
          PAYLOAD="$RUNNER_TEMP/releases.json"
          if [ -n "$SINCE" ]; then
            ./bin/nightgauge release fetch --source "$SOURCE" --since "$SINCE" --json > "$PAYLOAD"
          else
            ./bin/nightgauge release fetch --source "$SOURCE" --json > "$PAYLOAD"
          fi

          COUNT="$(jq '.releases | length' "$PAYLOAD")"
          # Releases come back newest-first, and `fetch` already drops drafts
          # and prereleases.
          NEW_VERSION="$(jq -r '.releases[0].tag_name // ""' "$PAYLOAD" | sed 's/^v//')"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected $COUNT release(s) newer than '${SINCE:-<none>}'; newest='$NEW_VERSION'"
        env:
          # `release fetch` sends this as a bearer token when present, which
          # lifts the unauthenticated api.github.com rate limit. Step-scoped:
          # this is the last step that sees a forge token, and it runs before
          # the model does. The payload it writes is what the model reads.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start from an empty proposal artifact
        # Written before the model runs, so a skipped or failed assessment
        # still uploads a well-formed "proposed nothing" artifact and `apply`
        # can always close the run record from it.
        run: |
          set -euo pipefail
          # Outside the checkout so the model cannot confuse it with repository state.
          mkdir -p "$RUNNER_TEMP/proposals"
          jq -n '{schema: 1, kind: "release-watch", proposals: []}' > "$RUNNER_TEMP/proposals/proposals.json"

      - name: Assess relevance and draft proposals
        id: assess
        # Three conditions, each of which independently degrades to
        # detection-only rather than failing the run:
        #   - a release was actually found
        #   - the kill switch is off (config gate resolved create_issues)
        #   - an API key exists for the model
        if: ${{ steps.detect.outputs.count != '0' && needs.gate.outputs.create_issues == 'true' && env.DRY_RUN != 'true' && env.HAS_API_KEY == 'true' }}
        env:
          # The model's whole environment: a model key and a scratch path.
          # Deliberately NO GH_TOKEN / GITHUB_TOKEN — the skill reads release
          # notes the repository does not control, and a forge credential here
          # would make any injected instruction a write.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SINCE: ${{ steps.detect.outputs.since }}
          PROPOSAL_FILE: ${{ runner.temp }}/proposals/proposals.json
          RELEASES_FILE: ${{ runner.temp }}/releases.json
        run: |
          set -euo pipefail
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.258

          # Prompt on stdin with `-p`, matching how the pipeline's own Claude
          # adapter invokes the CLI (internal/execution/adapters/claude.go).
          # Not the `/nightgauge:release-watch` slash command: that resolves
          # through the plugin marketplace, which is not installed on a
          # hosted runner. --allowedTools mirrors the SKILL.md frontmatter;
          # the tools are the same, the job holding them is not.
          claude -p \
            --no-session-persistence \
            --allowedTools "Bash,Read,Write,Glob,Grep" \
            --max-turns 60 <<PROMPT
          Execute the skill at skills/nightgauge-release-watch/SKILL.md in this
          repository, headlessly, with these arguments:

            --provider ${PROVIDER}
            --source ${SOURCE}
            --since ${SINCE}
            --dry-run

          The already-fetched release payload is at ${RELEASES_FILE}.

          You have no GitHub credentials and must not create issues, labels,
          or commits, and must not modify .nightgauge/. Instead, for each
          change scoring at or above ${SCORE_THRESHOLD}, write one proposal to
          ${PROPOSAL_FILE} as JSON with EXACTLY this shape and nothing else:

            {"schema": 1, "kind": "release-watch",
             "proposals": [{"title": "...", "body": "...", "labels": ["..."]}]}

          Rules: at most 10 proposals; title under 200 characters on one line;
          body under 20000 characters of Markdown; labels must include
          "source:auto-discovery" and "${PROVIDER}-release" and may add one
          type:* and one priority:* label from the skill's label strategy.
          Any other key or label is rejected downstream. If nothing scores
          above the threshold, leave the file as it is.
          PROMPT

          node scripts/validate-proposal-artifact.mjs --kind release-watch "$PROPOSAL_FILE"

      - name: Upload the proposal artifact
        # `always()` so `apply` has something to download even when detection
        # or assessment failed — the empty default written above.
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-watch-proposals
          path: ${{ runner.temp }}/proposals/proposals.json
          if-no-files-found: error
          retention-days: 7

  apply:
    name: Validate, file, and record
    needs: [gate, analyze]
    # Runs after `analyze` whatever its result, so a failed assessment is
    # recorded as a failed run rather than leaving the tab showing "running"
    # until tomorrow. Skipped only when the gate said not to run at all.
    if: ${{ always() && needs.gate.outputs.enabled == 'true' && needs.analyze.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Push the run record to the `discovery-state` branch.
      contents: write
      # File the validated proposals as issues.
      issues: write
    env:
      PROVIDER: ${{ inputs.provider || 'claude-code' }}
      SOURCE: ${{ inputs.source || 'anthropics/claude-code' }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      TRIGGERED_BY: ${{ github.event_name }}
      CREATE_ISSUES: ${{ needs.gate.outputs.create_issues }}
      SINCE: ${{ needs.analyze.outputs.since }}
      COUNT: ${{ needs.analyze.outputs.count }}
      NEW_VERSION: ${{ needs.analyze.outputs.new_version }}
      DETECT_OUTCOME: ${{ needs.analyze.outputs.detect_outcome }}
      ASSESS_OUTCOME: ${{ needs.analyze.outputs.assess_outcome }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Carry forward the previous run's state
        run: bash scripts/discovery-state-sync.sh

      - name: Open the run record
        # Opened BEFORE anything is filed so a run that dies mid-apply still
        # leaves a `status: running` record. A producer that only wrote on
        # success would look identical to a producer that never ran — which is
        # exactly the state this workflow exists to end.
        run: |
          python3 scripts/discovery-run-record.py open \
            --kind release-watch \
            --provider "$PROVIDER" \
            --source "$SOURCE" \
            --triggered-by "$TRIGGERED_BY" \
            --since-version "$SINCE" \
            --new-version "$NEW_VERSION"

      - name: Download the proposal artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-watch-proposals
          path: ${{ runner.temp }}/proposals

      - name: Validate the proposal artifact
        id: validate
        # The gate. Exact keys, bounded sizes, a label allowlist and a
        # proposal cap; anything else exits 1 and nothing below runs.
        env:
          PROPOSAL_FILE: ${{ runner.temp }}/proposals/proposals.json
        run: node scripts/validate-proposal-artifact.mjs --kind release-watch "$PROPOSAL_FILE"

      - name: File the validated proposals as issues
        id: file
        if: ${{ env.CREATE_ISSUES == 'true' && env.DRY_RUN != 'true' }}
        env:
          PROPOSAL_FILE: ${{ runner.temp }}/proposals/proposals.json
        run: |
          bash scripts/apply-proposal-artifact.sh \
            --kind release-watch \
            --file "$PROPOSAL_FILE" \
            --record ".nightgauge/release-watch/creation-log-${PROVIDER}.json"

      - name: Advance last-seen
        # In detection-only mode (no key, or kill switch on) the skill never
        # runs, so nothing else advances the pointer and the same release is
        # re-detected every morning forever.
        if: ${{ env.NEW_VERSION != '' && env.DRY_RUN != 'true' }}
        run: |
          set -euo pipefail
          LAST_SEEN=".nightgauge/release-watch/last-seen-${PROVIDER}.json"
          mkdir -p "$(dirname "$LAST_SEEN")"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ ! -f "$LAST_SEEN" ]; then
            printf '{"provider":"%s","source":"%s","version":"0.0.0","checked_at":"%s","releases_seen":[]}\n' \
              "$PROVIDER" "$SOURCE" "$NOW" > "$LAST_SEEN"
          fi
          jq --arg v "$NEW_VERSION" --arg at "$NOW" \
            '.version = $v | .checked_at = $at
             | .releases_seen = ([$v] + (.releases_seen // []) | unique_by(.) | .[0:10])' \
            "$LAST_SEEN" > "$LAST_SEEN.tmp"
          mv "$LAST_SEEN.tmp" "$LAST_SEEN"

      - name: Close the run record
        # `always()` so a failed assessment is recorded as a failed run rather
        # than leaving the tab showing "running" until tomorrow.
        if: ${{ always() }}
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          FILE_OUTCOME: ${{ steps.file.outcome }}
        run: |
          STATUS=completed
          ERROR=""
          if [ "$DETECT_OUTCOME" = "failure" ]; then
            STATUS=failed
            ERROR="release detection failed — see the workflow run log"
          elif [ "$ASSESS_OUTCOME" = "failure" ]; then
            STATUS=failed
            ERROR="release-watch assessment failed — see the workflow run log"
          elif [ "$VALIDATE_OUTCOME" = "failure" ]; then
            STATUS=failed
            ERROR="proposal artifact rejected by the schema gate — nothing was filed"
          elif [ "$FILE_OUTCOME" = "failure" ]; then
            STATUS=failed
            ERROR="issue creation failed — see the workflow run log"
          fi
          python3 scripts/discovery-run-record.py close \
            --kind release-watch \
            --provider "$PROVIDER" \
            --source "$SOURCE" \
            --triggered-by "$TRIGGERED_BY" \
            --status "$STATUS" \
            --error "$ERROR"

      - name: Publish state to the discovery-state branch
        if: ${{ always() }}
        run: |
          bash scripts/discovery-state-publish.sh \
            --message "chore(discovery): release-watch ${PROVIDER} ${NEW_VERSION:-no new release}"

      - name: Summarize the run
        if: ${{ always() }}
        env:
          GATE_REASON: ${{ needs.gate.outputs.reason }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          {
            echo "### Release watchdog"
            echo
            echo "- provider: \`$PROVIDER\` (\`$SOURCE\`)"
            echo "- since: \`$SINCE\`"
            echo "- releases detected: \`$COUNT\`"
            echo "- assessment: \`$ASSESS_OUTCOME\`; artifact: \`$VALIDATE_OUTCOME\`"
            echo "- issue creation: \`$CREATE_ISSUES\` ($GATE_REASON)"
            echo
            echo "Run \`scripts/discovery-state-sync.sh\` locally to see this in the Discovery tab."
          } >> "$GITHUB_STEP_SUMMARY"
