name: CodeQL

# Static analysis for Go and TypeScript. CodeQL is free for public repositories
# and self-activates on the visibility flip — no edit needed at launch (#137).
# Runs on an isolated GitHub-hosted image: this is fork-facing once public.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 08:17 UTC — an off-peak, non-round minute to avoid the
    # top-of-hour scheduling stampede.
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Gate on visibility. Code scanning requires GitHub Code Security, which a
    # PRIVATE repo does not have without an Advanced Security licence — the
    # upload step hard-fails with "Code Security must be enabled for this
    # repository to use code scanning", turning CI red for no benefit. CodeQL is
    # FREE for public repos, so this job stays skipped while the repo is private
    # and self-activates the moment it is made public. No edit needed at the flip
    # (#137).
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
