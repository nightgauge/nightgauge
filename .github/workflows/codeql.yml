name: CodeQL

# Static analysis for Go, TypeScript and the workflows themselves (the
# `actions` language covers .github/workflows). CodeQL is free for public
# repositories. Runs on an isolated GitHub-hosted image: this is fork-facing.
#
# `Analyze (go)`, `Analyze (javascript-typescript)` and `CodeQL` are required
# status checks on the main-branch ruleset (.github/rulesets/main-branch.json),
# so the job name and the existing matrix entries must not be renamed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 08:17 UTC — an off-peak, non-round minute to avoid the
    # top-of-hour scheduling stampede.
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"

  # A stable aggregate context is required alongside the language jobs. Keep
  # it fail-closed: always emit the check, but pass only when the entire matrix
  # succeeded.
  codeql:
    name: CodeQL
    if: always()
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Require every CodeQL analysis
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: test "$ANALYZE_RESULT" = success
