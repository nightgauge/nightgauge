# Release — Build & Publish (Production)
# Triggered by semver tags (v*.*.*) WITHOUT pre-release suffixes.
# Produces:
#   - Multi-arch Go binaries via goreleaser (darwin-arm64, darwin-amd64, linux-amd64)
#   - SHA256 checksums and manifest.json
#   - Homebrew cask auto-bumped in nightgauge/homebrew-tap
#   - Versioned per-target .vsix files (attached to the GitHub Release)
#   - The Claude plugin `stable` branch, advanced to the tag
#   - The VS Code Marketplace and Open VSX listings (marketplace-publish.yml)
#
# ONE TAG PUBLISHES TO EVERY CHANNEL (#3062): a release ships to every channel
# once its scans pass, or it does not ship. Every publish credential is checked
# by the preflight, before the draft exists.
#
# NOTHING IS PUBLIC BEFORE THE MULTI-ENGINE SCAN IS CLEAN (#2946). GoReleaser
# creates a DRAFT release and a DRAFT cask pull request. Every asset is
# attached to the draft, then scripts/release-scan-gate.sh downloads the
# draft's own bytes, unpacks every VSIX and tarball, and scans the assets plus
# every binary and JS bundle inside them with VirusTotal. Only a clean scan
# publishes the release. Any finding, error or missing VT_API_KEY leaves a
# draft and fails the run; the report is on the draft and in the run's
# artifacts (docs/GIT_WORKFLOW.md step 9a).
#
# Four jobs:
#   state       Is the release absent, a draft, or already published?
#   release     Absent or draft only: build, draft, attach, scan, publish. It
#               never runs against a published release, so a re-run cannot
#               upload to one.
#   channels    Only from a published, scan-clean release: advance `stable`,
#               mark the cask pull request ready.
#   registries  Same condition as `channels`, in parallel: calls
#               marketplace-publish.yml (registries: both), which downloads the
#               release's VSIXs (#2151), requires the release to be published
#               and scan-clean, and publishes to the VS Code Marketplace and
#               Open VSX.
# `channels` and `registries` are idempotent, so a re-run of a published
# release runs those two alone.
#
# Version is derived from the tag itself (not commit count).
# The Go binary and VSIX share the same version string.
#
# Promotion flow:
#   1. RC tag (v0.2.0-rc.1) → staging.yml builds & validates (no publish)
#   2. Release tag (v0.2.0)  → this workflow builds & publishes
#
# Prerequisites:
#   - VT_API_KEY secret in the `production` environment: a free VirusTotal
#     account's API key (docs/GIT_WORKFLOW.md). Without it nothing publishes.
#   - HOMEBREW_TAP_GITHUB_TOKEN secret in the `production` environment
#     (PAT with contents + pull-request write on nightgauge/homebrew-tap)
#   - VSCE_PAT and OVSX_PAT secrets in the `production` environment (see
#     marketplace-publish.yml). The preflight fails the run without any of the
#     three tokens.
#   - nightgauge/homebrew-tap repository must exist

name: Release

on:
  push:
    tags:
      # Match semver tags WITHOUT pre-release suffix (e.g., v0.2.0, v1.0.0)
      # This pattern excludes -rc.*, -beta.*, -alpha.* tags
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

# Pin the timezone so wall-clock-formatting snapshot tests are deterministic
# regardless of runner locale (same as ci.yml).
env:
  TZ: UTC

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Re-run safety (#2946). A release that is already published must never get
  # another upload, so the build-and-publish job is skipped for it and only
  # the idempotent channel steps run. Draft releases are visible only to a
  # token that can write contents, hence the write scope on a read.
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # read draft releases
    outputs:
      published: ${{ steps.state.outputs.published }}
    steps:
      - name: Release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if JSON="$(gh release view "$TAG" -R "$REPO" --json isDraft 2>"$RUNNER_TEMP/view.err")"; then
            DRAFT="$(jq -r '.isDraft | tostring' <<<"$JSON")"
          elif grep -qi 'release not found' "$RUNNER_TEMP/view.err"; then
            DRAFT="absent"
          else
            echo "::error::cannot read release $TAG: $(cat "$RUNNER_TEMP/view.err")"
            exit 1
          fi
          case "$DRAFT" in
          false) echo "published=true" >>"$GITHUB_OUTPUT"
                 echo "::notice::$TAG is already published: skipping build, upload, scan and publish; running only the channel steps." ;;
          true | absent) echo "published=false" >>"$GITHUB_OUTPUT"
                 echo "$TAG release state: ${DRAFT/true/draft}" ;;
          *) echo "::error::cannot tell whether $TAG is a draft ('$DRAFT')"; exit 1 ;;
          esac

  release:
    needs: state
    if: ${{ needs.state.outputs.published != 'true' }}
    # macos-latest, not ubuntu: Apple `codesign` runs only on macOS. macOS
    # still cross-compiles linux/amd64 (CGO_ENABLED=0). Proven on the rc
    # channel first (v0.4.4-rc.2) before this workflow adopted it.
    #
    # COST: free only because this repository is PUBLIC and this is a STANDARD
    # runner. Verified, not assumed -- the timing API reports MACOS total_ms 0
    # (`gh api repos/.../actions/runs/<id>/timing`). Making the repository
    # private would bill macOS at 10x the Linux rate, and a larger runner such
    # as macos-14-xlarge is billed even when public.
    runs-on: macos-latest
    # About 25 minutes of build, plus the VirusTotal scan: about 40 unique
    # files (v0.8.0: 11 assets, 6 binaries, 7 JS bundles, 17 exec-bit scripts
    # inside the VSIXs and tarballs), roughly 3 requests each, at the free
    # key's 4 requests/min. That is about 130 of the 500 requests a day.
    timeout-minutes: 120
    environment: production

    permissions:
      contents: write # create releases
      id-token: write # artifact attestations (OIDC)
      attestations: write # artifact attestations

    steps:
      # `state` ran first, but a `gh run rerun --failed` reuses its old answer.
      # Ask again: this job must never run against a published release.
      - name: Refuse a published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if DRAFT="$(gh release view "$TAG" -R "$REPO" --json isDraft --jq '.isDraft' 2>"$RUNNER_TEMP/view.err")"; then
            if [ "$DRAFT" != "true" ]; then
              echo "::error::$TAG is already published. Nothing is uploaded to a public release; re-run all jobs so only the channel steps run."
              exit 1
            fi
          elif ! grep -qi 'release not found' "$RUNNER_TEMP/view.err"; then
            echo "::error::cannot read release $TAG: $(cat "$RUNNER_TEMP/view.err")"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes with the checkout's credential: GoReleaser
          # and gh take GITHUB_TOKEN from the environment, so do not leave a
          # contents:write token in .git/config for npm postinstall scripts.
          persist-credentials: false
          # GoReleaser needs full history + tags: a shallow clone makes it warn
          # ("running against a shallow clone") and breaks previous-tag detection
          # and changelog generation.
          fetch-depth: 0

      - name: Ensure full working tree
        run: |
          git sparse-checkout disable 2>/dev/null || true
          git checkout -- . 2>/dev/null || true

      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Clear stale npx cache (arm64/x64 esbuild mismatch)
        run: rm -rf ~/.npm/_npx

      - name: Install dependencies
        run: npm ci

      - name: Extract version from tag
        id: version
        run: |
          # Strip leading 'v' from tag to get version
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # Guard: reject pre-release tags that somehow matched
          if [[ "$VERSION" == *-* ]]; then
            echo "ERROR: Pre-release tag '$TAG' should not trigger production release."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Production release: $TAG (version $VERSION)"

      # ---------------------------------------------------------------------
      # CHANGELOG GATE — the tag must already have its section in CHANGELOG.md
      # and the extension's changelog (docs/GIT_WORKFLOW.md § Changelog). This
      # runs before any credential probe or build so a missing rollover PR
      # fails in seconds and publishes nothing. The section body becomes the
      # GitHub Release notes in place of GoReleaser's raw commit list.
      # ---------------------------------------------------------------------
      - name: Changelog has a section for this tag
        id: changelog
        run: |
          set -euo pipefail
          bash scripts/check-changelog.sh --tag "${GITHUB_REF_NAME}"
          NOTES="${RUNNER_TEMP}/release-notes.md"
          bash scripts/check-changelog.sh --extract "${GITHUB_REF_NAME}" > "$NOTES"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          echo "Release notes ($(wc -l < "$NOTES") lines) from CHANGELOG.md § [${GITHUB_REF_NAME#v}]"

      # An installed plugin only updates when its version changes (#2724), so a
      # tag that changed the plugin without a bump publishes nothing.
      - name: Plugin version changed with the plugin
        run: bash scripts/check-plugin-version.sh --tag "${GITHUB_REF_NAME}"

      # ---------------------------------------------------------------------
      # PREFLIGHT — validate every publish credential BEFORE anything is
      # published (#3062). GoReleaser creates the GitHub Release before it
      # pushes the cask, and the registries publish after the release is
      # public, so a token found wanting late leaves a half-published
      # release. Fail fast instead.
      # ---------------------------------------------------------------------
      - name: Preflight — publish credentials
        id: preflight
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          # Presence only: the key itself is set on the scan step alone.
          VT_API_KEY_SET: ${{ secrets.VT_API_KEY != '' }}
        run: |
          set -euo pipefail

          # The release publishes only after a clean VirusTotal scan (#2946).
          # Without the key it would build for half an hour and stop at draft.
          if [ "$VT_API_KEY_SET" != "true" ]; then
            echo "::error::VT_API_KEY is not set in the production environment. Nothing can be scanned, so nothing may publish. Add a free VirusTotal account's API key (docs/GIT_WORKFLOW.md § Cutting a Release)."
            exit 1
          fi

          # Every channel or none (#3062): a missing token fails the run here,
          # before the draft exists. Report every missing token, then fail.
          MISSING=0
          for NAME in HOMEBREW_TAP_GITHUB_TOKEN VSCE_PAT OVSX_PAT; do
            if [ -z "${!NAME:-}" ]; then
              echo "::error::$NAME is not set in the production environment. A release publishes to every channel or to none (docs/GIT_WORKFLOW.md § Cutting a Release)."
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1

          # A PRESENT token is not a WORKING token, and the difference only
          # shows up at the tap push — after the GitHub Release exists. Since
          # the cask now arrives as a pull request (.goreleaser.yml), the token
          # needs `pull_requests: write` on top of `contents: write`, and a
          # contents-only token fails at exactly that late point.
          #
          # Probe both, without side effects:
          #   contents  — GET the repo; `.permissions.push` must be true.
          #   pull_reqs — POST a pull request with a head branch that cannot
          #               exist. GitHub authorizes before it validates the
          #               body, so 403 means "no permission" while 422 means
          #               "permitted, bad head" — the answer we want. Nothing
          #               is created on either path.
          echo "Verifying HOMEBREW_TAP_GITHUB_TOKEN can write to nightgauge/homebrew-tap…"

          # Every check here captures, then compares: piping a command into a
          # reader that exits early (grep -q, head) under pipefail can turn a
          # match into a miss when the writer takes SIGPIPE (#2360).
          TAP_PUSH="$(GH_TOKEN="$HOMEBREW_TAP_GITHUB_TOKEN" \
               gh api repos/nightgauge/homebrew-tap --jq '.permissions.push' 2>/dev/null || true)"
          if [ "$TAP_PUSH" != "true" ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN cannot write contents to nightgauge/homebrew-tap. Issue a fine-grained PAT with resource owner 'nightgauge', repository access limited to 'homebrew-tap', and Contents: Read and write. Failing now, before anything is published."
            exit 1
          fi

          PR_PROBE=$(GH_TOKEN="$HOMEBREW_TAP_GITHUB_TOKEN" \
            gh api -X POST repos/nightgauge/homebrew-tap/pulls \
              -f head=__release_preflight_probe__ -f base=main -f title=probe \
              -i 2>/dev/null | sed -n 1p || true)
          case "$PR_PROBE" in
            *403*)
              echo "::error::HOMEBREW_TAP_GITHUB_TOKEN can write contents but CANNOT open pull requests on nightgauge/homebrew-tap. The tap requires a PR (branch ruleset) and .goreleaser.yml opens one, so the release would fail at the tap step AFTER the GitHub Release already exists. Add 'Pull requests: Read and write' to the token. Failing now instead."
              exit 1
              ;;
            *422*)
              echo "HOMEBREW_TAP_GITHUB_TOKEN verified: contents + pull-request write."
              ;;
            *)
              echo "::warning::Homebrew tap token PR-permission probe returned an unexpected response ('${PR_PROBE:-empty}'). Proceeding, but if the release fails at the tap step, check that the token has 'Pull requests: Read and write'."
              ;;
          esac

          # The same non-mutating checks marketplace-publish.yml runs before it
          # publishes (scripts/verify-registry-pat.sh).
          bash scripts/verify-registry-pat.sh marketplace
          bash scripts/verify-registry-pat.sh open-vsx

          echo "goreleaser_args=release --clean --release-notes ${{ steps.changelog.outputs.notes }}" >> "$GITHUB_OUTPUT"

      # Cross-compile every target binary up front so each platform-specific
      # .vsix can bundle the matching one. The extension loads its Go binary from
      # the bundled dist/bin/ (no runtime download), so the VSIXs stay
      # per-target: the linux one carries the linux binary. `make build-all`
      # emits bin/nightgauge-{darwin-arm64,darwin-amd64,linux-amd64}.
      - name: Build all Go binaries (per-target VSIX bundling)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make build-all VERSION="$VERSION"

      # Both darwin targets ship one universal (x86_64 + arm64) Mach-O: the
      # signed thin darwin/amd64 build was flagged by Microsoft's model, and the
      # signed universal file was clean at every version measured (#3161,
      # docs/RELEASE_BINARIES.md).
      - name: Join the darwin binaries into one universal Mach-O
        run: make darwin-universal

      # Sign before anything packages these binaries. The VSIX freezes whatever
      # is in dist/bin/, and GoReleaser copies bin/ into the archives and the
      # cask (.goreleaser.yml hooks.post), so signing afterwards would ship an
      # unsigned copy while reporting success. Signing is REQUIRED here
      # (#3064): missing Apple secrets, or a binary without the team's
      # Developer ID and the hardened runtime, fail this step, so a secretless
      # re-run fails here, before the draft exists. The universal file is
      # signed ONCE and copied over both darwin paths, so both darwin VSIXs,
      # both darwin archives and the cask carry identical bytes.
      - name: Sign the macOS binaries
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          bash scripts/sign-macos-binaries.sh --require-team RZJPN7Y7BG \
            bin/nightgauge-darwin-universal
          cp bin/nightgauge-darwin-universal bin/nightgauge-darwin-amd64
          cp bin/nightgauge-darwin-universal bin/nightgauge-darwin-arm64

      # Build EVERY workspace before testing, not just the SDK. The VSCode suite
      # has an integration test (tests/integration/failureTaxonomyPackaging.test.ts)
      # asserting `dist/failure-taxonomy.yaml` exists — a file only the extension's
      # own `build:assets` step produces. Building the SDK alone left it absent, so
      # `Run tests` could never pass here. ci.yml does not hit this because its
      # VSCode job runs the root `npm run build` before testing.
      - name: Build all workspaces (SDK + extension assets)
        run: npm run build

      - name: Run tests
        run: npm run test -- --run

      - name: Inject release version
        working-directory: packages/nightgauge
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Split the canonical `npm run package` (build + vsce package) so we can
      # stamp `dist/build-info.json` AFTER the build pipeline writes into
      # `dist/` but BEFORE `vsce package` freezes it. Before legacy issue 3650 the stamp ran
      # earlier and any future `dist/` rewrite (rm -rf in clean step, new
      # asset path) could silently omit it from the .vsix and leave
      # ExtensionStalenessService stuck in `state: "unknown"` on the
      # installed extension. legacy issue 3650 (Part B).
      - name: Build extension (pre-package)
        working-directory: packages/nightgauge
        run: npm run build

      # Legacy issues 3300 / 3650: stamp build provenance so ExtensionStalenessService
      # can report when the running extension is behind workspace HEAD
      # (informational only; no dispatch is refused). Stamping happens
      # AFTER `npm run build` so dist/ already exists in its final shape, and
      # the helper script asserts the file is parseable JSON before we
      # continue — a missing stamp is a hard fail, not a silent skip.
      - name: Stamp build provenance
        env:
          BUILD_BRANCH: ${{ github.ref_name }}
          # #2721: a stamp carrying `tag` is a CI-built release candidate or
          # release, so the staleness item never offers a local rebuild.
          BUILD_TAG: ${{ steps.version.outputs.tag }}
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          DIST=packages/nightgauge/dist
          BUILD_SHA=$(git rev-parse HEAD)
          COMMIT_TIMESTAMP=$(git log -1 --format=%cI HEAD)
          BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > "$DIST/build-info.json" <<EOF_BUILD_INFO
          {
            "commitSha": "$BUILD_SHA",
            "branch": "$BUILD_BRANCH",
            "tag": "$BUILD_TAG",
            "version": "$BUILD_VERSION",
            "commitTimestamp": "$COMMIT_TIMESTAMP",
            "buildTimestamp": "$BUILD_TIMESTAMP",
            "schemaVersion": "2"
          }
          EOF_BUILD_INFO
          echo "Stamped: $BUILD_SHA ($BUILD_BRANCH @ $COMMIT_TIMESTAMP)"
          bash packages/nightgauge/scripts/check-build-info.sh \
            "$DIST/build-info.json"

      # Package one .vsix PER VS Code target, each bundling the matching binary
      # swapped into dist/bin/. `vsce package --target <t>` names the file
      # nightgauge-<t>-<version>.vsix; the Marketplace serves the
      # correct one per user automatically. A single universal .vsix would ship
      # one arch and fail to launch the backend on every other platform.
      - name: Package per-target VSIXs
        working-directory: packages/nightgauge
        run: |
          set -euo pipefail
          # vsce target -> Makefile binary suffix (GOOS-GOARCH)
          # vsce target -> Makefile binary suffix, as a case rather than an
          # associative array. `declare -A` needs bash 4, and macOS ships bash
          # 3.2 for licensing reasons, so the array silently mangles into an
          # unbound variable there. Keeping this portable means the same step
          # runs on ubuntu and on the macos runner that codesigning requires.
          bin_suffix() {
            case "$1" in
              darwin-arm64) echo darwin-arm64 ;;
              darwin-x64)   echo darwin-amd64 ;;
              linux-x64)    echo linux-amd64 ;;
              *) echo "unknown target $1" >&2; return 1 ;;
            esac
          }
          # vsce records the pre-release flag in the VSIX manifest at PACKAGE
          # time; `publish --pre-release` on a VSIX packaged without it is
          # refused (#1299). Keep release assets aligned with registry channel.
          VERSION="$(node -p "require('./package.json').version")"
          CHANNEL=()
          CHANNEL_NAME="$(bash "$GITHUB_WORKSPACE/scripts/marketplace-channel.sh" "$VERSION")"
          if [[ "$CHANNEL_NAME" == "pre-release" ]]; then
            CHANNEL=(--pre-release)
            echo "Version $VERSION → packaging as pre-release"
          else
            echo "Version $VERSION → packaging as release"
          fi
          mkdir -p dist/bin
          for T in darwin-arm64 darwin-x64 linux-x64; do
            SRC="../../bin/nightgauge-$(bin_suffix "$T")"
            [[ -f "$SRC" ]] || { echo "ERROR: missing $SRC (did 'make build-all' run?)"; exit 1; }
            cp "$SRC" dist/bin/nightgauge
            chmod +x dist/bin/nightgauge
            npx @vscode/vsce@3.9.2 package --no-dependencies --target "$T" ${CHANNEL[@]+"${CHANNEL[@]}"}
          done
          echo "Packaged:"; ls -1 *.vsix

      # The VSIX binaries are cross-compiled, so the bundle check below needs one
      # built for this runner (#2761).
      - name: Build the runner's binary
        run: go build -o "$RUNNER_TEMP/nightgauge-runner" ./cmd/nightgauge

      # Defense-in-depth: every .vsix must carry the build-info stamp AND a
      # bundled binary before GoReleaser hands them to consumers — and must NOT
      # ship source maps or type declarations (.vscodeignore drift).
      - name: Verify VSIX contents
        working-directory: packages/nightgauge
        env:
          # Non-empty only when a signing certificate is configured, so the
          # assertion is strict on a real release and informational otherwise.
          APPLE_SIGNING_EXPECTED: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          COUNT=0
          for VSIX in *.vsix; do
            COUNT=$((COUNT + 1))
            # One listing, then here-strings: `unzip -l | grep -q` under
            # pipefail can SIGPIPE unzip at an early match and fail a good
            # VSIX, or pass one that ships a source map (#2360).
            LISTING="$(unzip -l "$VSIX")"
            grep -q 'extension/dist/build-info.json' <<<"$LISTING" \
              || { echo "ERROR: $VSIX missing build-info.json (ExtensionStalenessService would report 'unknown')"; exit 1; }
            grep -q 'extension/dist/bin/nightgauge' <<<"$LISTING" \
              || { echo "ERROR: $VSIX missing bundled Go binary"; exit 1; }
            grep -q 'extension/dist/sdk-cli.cjs' <<<"$LISTING" \
              || { echo "ERROR: $VSIX missing bundled SDK CLI"; exit 1; }
            if grep -qE '\.(map|d\.ts)$' <<<"$LISTING"; then echo "ERROR: $VSIX ships source maps or type declarations"; exit 1; fi
            # No shipped file may carry a fetch piped to a shell or a base64
            # decode, from whichever package it was bundled (#2320, #2321).
            bash scripts/check-shipped-code.sh "$VSIX"

            # Validate the skills this VSIX carries, not dist/: only the
            # extracted tree speaks for what .vscodeignore let through (#2761).
            SKILLS_TMP="$(mktemp -d "$RUNNER_TEMP/vsix-skills.XXXXXX")"
            unzip -q "$VSIX" 'extension/dist/skills/*' -d "$SKILLS_TMP"
            "$RUNNER_TEMP/nightgauge-runner" preflight skill-bundle \
              --skills-root "$SKILLS_TMP/extension/dist/skills" \
              --source-root "$GITHUB_WORKSPACE/skills"
            rm -rf "$SKILLS_TMP"

            # Assert the PACKAGED binary is Developer ID signed, not merely the
            # one the signing step touched. The VSIX freezes a copy, so this is
            # the only check that speaks for what a user installs -- and the
            # 0.4.2 Open VSX publish is the standing reminder that a step's own
            # success line is not evidence.
            case "$VSIX" in
              *darwin*)
                unzip -p "$VSIX" extension/dist/bin/nightgauge > "$RUNNER_TEMP/packaged-bin"
                if [[ -n "${APPLE_SIGNING_EXPECTED:-}" ]]; then
                  # -dvvv prints everything -dv does (the flags line too).
                  SIGNATURE="$(codesign -dvvv "$RUNNER_TEMP/packaged-bin" 2>&1 || true)"
                  grep -q 'Authority=Developer ID Application' <<<"$SIGNATURE" \
                    || { echo "ERROR: $VSIX ships a binary that is not Developer ID signed"; exit 1; }
                  grep -q 'flags=0x10000(runtime)' <<<"$SIGNATURE" \
                    || { echo "ERROR: $VSIX binary lacks the hardened runtime"; exit 1; }
                  echo "OK: $VSIX carries a Developer ID signature with hardened runtime"
                else
                  SIGNATURE="$(codesign -dv "$RUNNER_TEMP/packaged-bin" 2>&1 || true)"
                  if grep -q 'adhoc' <<<"$SIGNATURE"; then
                    echo "NOTE: $VSIX binary is ad-hoc signed (no Apple secrets configured)"
                  fi
                fi
                rm -f "$RUNNER_TEMP/packaged-bin"
                ;;
            esac
            echo "OK: $VSIX"
          done
          [[ "$COUNT" -eq 3 ]] || { echo "ERROR: expected 3 per-target VSIXs, found $COUNT"; exit 1; }

      # Both darwin VSIXs and both darwin bin/ binaries must be the one signed
      # universal Mach-O (#3161). A thin darwin/amd64 binary is the build
      # Microsoft's model flagged. GoReleaser copies bin/ into the archives and
      # the cask, and verify-archive-binaries.sh proves those match bin/.
      - name: Verify the darwin binaries are the universal file
        run: bash scripts/verify-darwin-universal.sh packages/nightgauge bin

      # Malware-scan every artifact BEFORE anything is attested or published.
      # v0.4.4 reached the Marketplace unscanned by us and was flagged there
      # (6/66, all generic heuristics, artifact clean). Whatever a scanner is
      # going to say, we say it first. Runs on macOS because this job needs
      # macos-latest for `codesign`, with the official pinned ClamAV package;
      # scripts/install-clamav-macos.sh says why not Homebrew.
      #
      # The gate is not clamscan's exit code: clamscan exits 0 both for a clean
      # artifact and for one it never read. malware-scan.sh additionally asserts
      # a floor on bytes actually scanned. See scripts/malware-scan.sh.
      - name: Malware scan (ClamAV)
        run: |
          set -euo pipefail
          bash scripts/install-clamav-macos.sh
          export PATH="/usr/local/clamav/bin:$PATH"
          freshclam
          bash scripts/malware-scan.sh \
            --report "$RUNNER_TEMP/clamav-report.json" \
            packages/nightgauge/*.vsix bin/

      - name: Upload malware scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clamav-scan-report${{ github.job }}
          path: ${{ runner.temp }}/clamav-report.json
          if-no-files-found: warn

      # `Inject release version` runs `npm version`, which rewrites the extension's
      # package.json AND the root package-lock.json. GoReleaser's `validate` pipe
      # then refuses to release ("git is in a dirty state"). The version is already
      # baked into the packaged .vsix files by this point, so restoring those two
      # tracked files is safe and keeps validate's tag/dirty guarantees intact.
      # Build outputs (bin/, dist/, *.vsix) are gitignored, hence --untracked-files=no.
      - name: Restore working tree for GoReleaser
        run: |
          set -euo pipefail
          git checkout -- package-lock.json packages/nightgauge/package.json
          DIRTY="$(git status --porcelain --untracked-files=no)"
          if [ -n "$DIRTY" ]; then
            echo "::error::Working tree still dirty before GoReleaser — it refuses to release. Modified:"
            printf '%s\n' "$DIRTY"
            exit 1
          fi
          echo "Working tree clean; GoReleaser validate will pass."

      # syft powers the `sboms:` block in .goreleaser.yml (one SPDX SBOM per
      # archive). GitHub-hosted runners do not ship syft, so install it — pinned
      # to a SHA — before goreleaser runs, or the SBOM pipe fails.
      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # THIRD_PARTY_NOTICES is listed in .goreleaser.yml archives.files, so it
      # must exist at repo root before goreleaser archives. `npm run build` above
      # already generated it; regenerate defensively (idempotent) in case build
      # ordering changes. It is gitignored, so it never dirties the tree.
      - name: Ensure THIRD_PARTY_NOTICES for archives
        run: npm run notices

      # args come from the preflight, which has already verified the tap
      # token: there is no degraded, Homebrew-less release (#3062).
      # GORELEASER_CURRENT_TAG pins the release to the tag that triggered this
      # run. Without it GoReleaser takes the highest tag pointing at HEAD by
      # git's version sort, which ranks `v0.2.0-rc.25` ABOVE `v0.2.0` — so the
      # first stable release, cut on the same commit as its last RC exactly as
      # the git workflow prescribes, published an rc GitHub Release and an rc
      # cask PR and then failed here looking for `v0.2.0` (#1296).
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.17.0
          args: ${{ steps.preflight.outputs.goreleaser_args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # #3064: the archives and the cask must carry the signed bin/ binaries,
      # byte for byte. The draft is not public yet, so failing here keeps an
      # unsigned archive from ever publishing.
      - name: Verify archives carry the signed bin/ binaries
        run: bash scripts/verify-archive-binaries.sh dist bin

      # #3091: release binaries ship unstripped (docs/RELEASE_BINARIES.md).
      # Read the packaged bytes, not the flags, and prove every Go binary in
      # every archive and VSIX carries DWARF before any VirusTotal scan sees
      # them. Built once rather than `go run`, so exit 1 (a binary lacks
      # DWARF) and exit 2 (nothing checked) stay distinct in the log; both
      # fail this step.
      - name: Verify every shipped binary carries DWARF (docs/RELEASE_BINARIES.md)
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/release-dwarf-check" ./cmd/release-dwarf-check
          "$RUNNER_TEMP/release-dwarf-check" dist/*.tar.gz packages/nightgauge/*.vsix

      # A YARA text pattern that once flagged a release must never ship again:
      # v0.8.4 was held by InQuest's Microsoft_Excel_Hidden_Macrosheet matching
      # the extension bundle (#3102, docs/RELEASE_BINARIES.md).
      - name: Verify no shipped text file matches a known YARA text pattern (docs/RELEASE_BINARIES.md)
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/release-text-pattern-check" ./cmd/release-text-pattern-check
          "$RUNNER_TEMP/release-text-pattern-check" --patterns configs/release-text-patterns.yaml \
            dist/*.tar.gz packages/nightgauge/*.vsix

      # Every step below addresses the release by the triggering tag. Prove
      # GoReleaser created THAT release before attaching anything to it.
      - name: Verify GoReleaser drafted the triggering tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Captured, then compared: `gh … | grep -qx` under pipefail can read
          # a match as a miss when gh takes SIGPIPE (#2360).
          RELEASED="$(gh release view "$TAG" --json tagName,isDraft --jq '"\(.tagName) \(.isDraft)"' || true)"
          if [ "$RELEASED" != "$TAG true" ]; then
            echo "::error::GoReleaser did not create a DRAFT GitHub Release for '$TAG' (#1296, #2946): got '${RELEASED:-none}'. Releases present:"
            gh release list --limit 5
            exit 1
          fi
          echo "Draft GitHub Release $TAG exists"

      - name: Add VSIX checksums
        run: |
          set -euo pipefail
          for vsix in packages/nightgauge/*.vsix; do
            sha256sum "$vsix" | sed 's#  packages/nightgauge/#  #'
          done >> dist/checksums.txt
          sort -k2,2 -o dist/checksums.txt dist/checksums.txt

      # manifest.json is derived from the combined checksums.txt after
      # GoReleaser runs, but intentionally selects only CLI archives. The SDK
      # postinstall fetches it to SHA256-verify downloaded binaries; VSIX
      # integrity remains covered by checksums.txt. GoReleaser cannot attach a
      # manifest that does not exist yet via `extra_files`, and v2 has no
      # `after:` hook.
      - name: Generate + attach manifest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/generate-manifest.py dist/ > dist/manifest.json
          test -s dist/manifest.json || { echo "ERROR: empty manifest.json"; exit 1; }
          gh release upload "$TAG" dist/checksums.txt --clobber
          gh release upload "$TAG" dist/manifest.json --clobber
          echo "Attached combined checksums.txt and CLI archive manifest.json"

      - name: Attach VSIXs to GitHub Release
        working-directory: packages/nightgauge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" *.vsix --clobber
          echo "Attached: $(ls -1 *.vsix | tr '\n' ' ')"

      # Supply-chain provenance: signed build attestations for every consumer-
      # facing artifact, verifiable with `gh attestation verify <file> --repo
      # <owner>/<repo>`. Attestations are only available on public repositories
      # for this plan, so the steps skip rather than fail if the repository's
      # visibility ever changes.
      - name: Attest binary archives + manifest + SBOMs
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/manifest.json
            dist/*.spdx.sbom.json

      - name: Attest VSIXs
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/nightgauge/*.vsix

      # THE GATE (#2946). Scan the draft's own downloaded bytes -- every asset,
      # and every binary and JS bundle inside each VSIX and tarball -- with
      # VirusTotal, and publish the release only when every file is clean. A
      # finding, an API error, a timeout or a spent quota leaves the draft and
      # fails the run. The key is set on this step alone and reaches curl only
      # through a config on stdin. A re-run reuses the draft.
      - name: VirusTotal scan of the draft; publish only when clean
        # ~40 unique files x ~3 requests = ~130 requests at 4/min, about 33
        # minutes (see the job's timeout note); 80 leaves room for slow analyses.
        timeout-minutes: 80
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          bash scripts/release-scan-gate.sh scan "$TAG" \
            --report "$RUNNER_TEMP/vt-scan-report.json"

      - name: Upload VirusTotal scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vt-scan-report
          path: ${{ runner.temp }}/vt-scan-report.json
          if-no-files-found: warn

  # Every channel moves only from a published, scan-clean release (#2946). Runs
  # after `release` published, or alone when `state` found the release already
  # published (a re-run). Each step is idempotent. `registries` below runs
  # under this exact condition (scripts/test-release-channel-wiring.sh).
  channels:
    needs: [state, release]
    if: ${{ !cancelled() && needs.state.result == 'success' && (needs.release.result == 'success' || (needs.release.result == 'skipped' && needs.state.outputs.published == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write # advance-stable.sh moves the stable branch
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require a published, scan-clean release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-scan-gate.sh verify "$TAG"

      # Claude plugin channel (#2724): the marketplace is installed at #stable,
      # which only this step moves, so plugins reach users with a release and
      # never from main. After every publish step, so a failed publish leaves
      # stable alone; before the cask step, which concerns another
      # channel and must not hold plugins back.
      # Fast-forward only; a refused move fails here, naming its cause, and the
      # watchdog's claude-plugin channel stays red until a maintainer moves the
      # branch. github.token cannot update a ref across .github/workflows changes
      # if the stable-move probe says so; STABLE_BRANCH_TOKEN then carries that
      # permission (docs/GIT_WORKFLOW.md).
      - name: Advance the stable branch to this release
        id: advance-stable
        env:
          GH_TOKEN: ${{ secrets.STABLE_BRANCH_TOKEN || github.token }}
        run: bash scripts/advance-stable.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"

      # FINAL STEP. GoReleaser only PROPOSES the cask, as a DRAFT pull request
      # on the tap (.goreleaser.yml), so the release is not complete until that
      # pull request merges. verify-release-channels.sh --release re-runs
      # release-scan-gate.sh verify, marks the draft cask PR ready, closes
      # every older cask PR as superseded so the queue cannot pile up (#1874:
      # seven sat open), and names the one to merge. The daily release
      # watchdog stays red until the tap's main serves this version.
      - name: Homebrew cask ready; close superseded cask PRs
        # Runs after a refused stable move too: the release is already out.
        if: ${{ !cancelled() && steps.advance-stable.conclusion != 'skipped' }}
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          GH_TOKEN="$HOMEBREW_TAP_GITHUB_TOKEN" bash scripts/verify-release-channels.sh \
            --channel homebrew --release --version "$VERSION" --close-superseded

  # VS Code Marketplace and Open VSX (#3062), under the same condition as
  # `channels` and in parallel with it. marketplace-publish.yml carries every
  # guard: stable tag ref, published scan-clean release, digest, provenance
  # and channel checks, and per-target listing confirmation. Its own
  # `environment: production` resolves VSCE_PAT and OVSX_PAT.
  # A called job cannot hold more than its caller grants, so this grants the
  # callee's `attestations: read` as well as `contents: read`.
  # publish-vsix-set.sh is idempotent, so a re-run of a published tag is safe.
  registries:
    needs: [state, release]
    if: ${{ !cancelled() && needs.state.result == 'success' && (needs.release.result == 'success' || (needs.release.result == 'skipped' && needs.state.outputs.published == 'true')) }}
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/marketplace-publish.yml
    with:
      registries: both
    secrets: inherit
