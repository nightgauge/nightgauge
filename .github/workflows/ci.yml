# CI — build and test on isolated GitHub-hosted runners.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Pin the timezone so wall-clock-formatting snapshot tests are deterministic
# regardless of runner locale.
env:
  TZ: UTC

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Deterministic change-class gate (#647). Classifies the PR's ACTUAL DIFF and
  # publishes `run_heavy`, which gates the EXPENSIVE STEPS of the three heavy
  # jobs below — never the jobs themselves.
  #
  # That distinction is the whole design. `Go build & test`, `SDK build & test`
  # and `VSCode build & test` are required status checks on the `main` ruleset.
  # GitHub does not treat a skipped required check as satisfied when the job was
  # skipped by a job-level `if:` on a workflow that ran — the check simply never
  # reports, and the pull request stays blocked forever with no way to unblock
  # it short of `--admin`, which waives the entire ruleset. So the jobs always
  # run and always report; only their inner steps are conditional.
  #
  # This job is intentionally NOT a required check: nothing may depend on a
  # gate whose only job is to decide how much work to do.
  changes:
    name: Change class
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_heavy: ${{ steps.classify.outputs.run_heavy }}
      change_class: ${{ steps.classify.outputs.change_class }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      # fetch-depth: 0 — the classifier diffs base...head, and both endpoints
      # must exist locally. A shallow clone makes the gate fail open (full
      # suite), which is safe but silently pointless.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # The classification comes from the diff between the PR's base and head
      # commits — not the branch name, not the PR title. On `push` (merge-skew)
      # there is no pull_request payload, the SHAs are empty, and the script
      # forces the full suite.
      - name: Classify the pull request diff
        id: classify
        env:
          NG_EVENT_NAME: ${{ github.event_name }}
          NG_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NG_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-change-class.sh

  go:
    name: Go build & test
    runs-on: ubuntu-latest
    needs: changes
    # `!cancelled()`, not the implicit `success()`. A failed or skipped gate
    # must still let this required job run and report — with `run_heavy` then
    # unset, `!= 'false'` is true and the full suite runs. The gate can only
    # ever remove work when it positively succeeded.
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Configure git identity (tests create local repos)
        # Identity is scoped to a per-job file via GIT_CONFIG_GLOBAL.
        run: |
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig"
          git config --global user.email "ci@nightgauge.dev"
          git config --global user.name "Nightgauge CI"
          git config --global init.defaultBranch main
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # DELIBERATELY UNGATED, and the only step here that is. It drives
      # scripts/ci-change-class.sh against real git fixtures and asserts this
      # very file still consumes the gate's outputs. Gating it would mean the
      # docs-only PRs — the exact runs the gate acts on — are the ones that
      # never check the gate, and a gate nothing exercises decays into an
      # unconditional pass (#539/#549). ~10s, all of it the classifier build.
      - name: CI change-class gate regression suite
        run: bash scripts/test-ci-change-class.sh
      - name: Build
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: go build ./...
      - name: Vet
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: go vet ./...
      - name: Gofmt
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: |
          UNFORMATTED="$(gofmt -l ./internal ./cmd)"
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - name: Test
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: go test ./... -count=1
      # Scoped to internal/orchestrator (#428): the deterministic pins in
      # autonomous_background_lifecycle_pin_test.go guard the production
      # lifecycle, but nothing else detects a drainBackground() call being
      # deleted from a test body — the tests pass with or without it, which is
      # why the flake stayed invisible. The race detector is the only mechanism
      # that fails on a removed drain. ~40s on top of the suite above.
      # Whole-tree -race is a follow-up: it triples the Go job and surfaces
      # unrelated pre-existing races this change neither owns nor worsens.
      - name: Test (race, orchestrator)
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: go test -race -count=1 ./internal/orchestrator/
      # The shell-side decision procedure AGENTS.md § Clean up on merge
      # defers to for `git branch -D` calls, kept aligned with the Go sweep's
      # own ancestry-acceptance door (#593). No npm/node needed, so it runs
      # here rather than in lint.yml.
      - name: branch-merged-check.sh regression suite
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: bash scripts/test-branch-merged-check.sh

  # The Node suite (~15.5k tests) is split into two parallel jobs so it fits the
  # window on 2-core runners. `npm ci` needs no registry auth: the tree vendors
  # its generated platform types and depends on no private packages.
  sdk:
    name: SDK build & test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Configure git identity
        # Identity is scoped to a per-job file via GIT_CONFIG_GLOBAL.
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: |
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig"
          git config --global user.email "ci@nightgauge.dev"
          git config --global user.name "Nightgauge CI"
          git config --global init.defaultBranch main
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
      # setup-node is gated with the rest: `npm ci` is this job's dominant cost
      # (~62s of its ~99s), and restoring an npm cache for an install that will
      # not happen is pure runner time.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: npm ci
      - name: Build
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: npm run build
      - name: Test (SDK)
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: npm run -w @nightgauge/sdk test

  vscode:
    name: VSCode build & test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Configure git identity (tests create local repos)
        # Identity is scoped to a per-job file via GIT_CONFIG_GLOBAL.
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: |
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig"
          git config --global user.email "ci@nightgauge.dev"
          git config --global user.name "Nightgauge CI"
          git config --global init.defaultBranch main
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: npm ci
      - name: Build
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: npm run build
      - name: Test (VSCode)
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: npm run -w nightgauge-vscode test
      - name: Generated VSCode contributions in sync
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: npx -w nightgauge-vscode tsx scripts/generate-package-contributions.ts --check
      - name: "@types/vscode <= engines.vscode (vsce packaging invariant)"
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: node packages/nightgauge-vscode/scripts/check-engine-types.mjs

  # Security & license gates. Runs on every PR, including forks — a fork cannot
  # ship a vulnerable stdlib or a copyleft/proprietary dependency into a release
  # without this job going red.
  #
  # DELIBERATELY NOT change-class gated (#647). govulncheck's answer is a
  # function of the advisory database as much as of the diff, so "the diff
  # cannot have introduced a vulnerability" does not imply "there is no new
  # vulnerability to find". At 60s it is a tenth of the matrix's cost and the
  # only unconditional supply-chain signal on a pull request; trading a
  # standing security gate for a minute is the wrong side of that exchange.
  security:
    name: Security & license gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Go vulnerability scan (govulncheck)
        # Fails on any stdlib/dependency vulnerability reachable from the code.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Go dependency-license gate (go-licenses)
        # Blocks proprietary (forbidden) and GPL/AGPL-family (restricted)
        # licenses. Reciprocal (MPL-2.0, file-level copyleft) is allowed — it is
        # compatible with Apache-2.0 redistribution and present transitively via
        # go-git (filepath-securejoin). modernc.org/mathutil is BSD-3-Clause but
        # its LICENSE file defeats go-licenses' detector, so it is ignored.
        run: |
          go install github.com/google/go-licenses@v1.6.0
          "$(go env GOPATH)/bin/go-licenses" check ./cmd/nightgauge \
            --disallowed_types=forbidden,restricted \
            --ignore modernc.org/mathutil
      - name: npm vulnerability gate
        run: node scripts/npm-audit-check.js
      - name: npm dependency-license gate (publishable packages)
        # Scans the two packages that actually ship (SDK, VSCode extension);
        # fails on any copyleft/proprietary production license.
        run: |
          DENY='GPL-1.0;GPL-2.0;GPL-3.0;LGPL-2.0;LGPL-2.1;LGPL-3.0;AGPL-1.0;AGPL-3.0;SSPL-1.0;CC-BY-NC-4.0;UNLICENSED'
          npx license-checker --production --start packages/nightgauge-sdk --failOn "$DENY"
          npx license-checker --production --start packages/nightgauge-vscode --failOn "$DENY"
      - name: License-header guard (source + build output)
        run: bash scripts/check-license-headers.sh
