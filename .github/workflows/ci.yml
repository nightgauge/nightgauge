# CI — build and test on isolated GitHub-hosted runners.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Pin the timezone so wall-clock-formatting snapshot tests are deterministic
# regardless of runner locale.
env:
  TZ: UTC

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Deterministic change-class gate (#647). Classifies the PR's ACTUAL DIFF and
  # publishes `run_heavy`, which gates the EXPENSIVE STEPS of the three heavy
  # jobs below — never the jobs themselves.
  #
  # That distinction is the whole design. `Go build & test`, `SDK build & test`
  # and `VSCode build & test` are required status checks on the `main` ruleset.
  # GitHub does not treat a skipped required check as satisfied when the job was
  # skipped by a job-level `if:` on a workflow that ran — the check simply never
  # reports, and the pull request stays blocked forever with no way to unblock
  # it short of `--admin`, which waives the entire ruleset. So the jobs always
  # run and always report; only their inner steps are conditional.
  #
  # This job is intentionally NOT a required check: nothing may depend on a
  # gate whose only job is to decide how much work to do.
  changes:
    name: Change class
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_heavy: ${{ steps.classify.outputs.run_heavy }}
      change_class: ${{ steps.classify.outputs.change_class }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      # fetch-depth: 0 — the classifier diffs base...head, and both endpoints
      # must exist locally. A shallow clone makes the gate fail open (full
      # suite), which is safe but silently pointless.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # The classification comes from the diff between the PR's base and head
      # commits — not the branch name, not the PR title. On `push` (merge-skew)
      # there is no pull_request payload, the SHAs are empty, and the script
      # forces the full suite.
      - name: Classify the pull request diff
        id: classify
        env:
          NG_EVENT_NAME: ${{ github.event_name }}
          NG_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NG_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-change-class.sh

  go:
    name: Go build & test
    runs-on: ubuntu-latest
    needs: changes
    # `!cancelled()`, not the implicit `success()`. A failed or skipped gate
    # must still let this required job run and report — with `run_heavy` then
    # unset, `!= 'false'` is true and the full suite runs. The gate can only
    # ever remove work when it positively succeeded.
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Configure git identity (tests create local repos)
        # Identity is scoped to a per-job file via GIT_CONFIG_GLOBAL.
        run: |
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig"
          git config --global user.email "ci@nightgauge.dev"
          git config --global user.name "Nightgauge CI"
          git config --global init.defaultBranch main
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # DELIBERATELY UNGATED (1 of 2). It drives scripts/ci-change-class.sh
      # against real git fixtures and asserts this very file still consumes the
      # gate's outputs. Gating it would mean the docs-only PRs — the exact runs
      # the gate acts on — are the ones that never check the gate, and a gate
      # nothing exercises decays into an unconditional pass (#539/#549). ~10s,
      # all of it the classifier build.
      - name: CI change-class gate regression suite
        run: bash scripts/test-ci-change-class.sh
      # DELIBERATELY UNGATED (2 of 2), for a sharper reason than the step above:
      # gating these would disable the guard on precisely the change class it
      # exists to catch. internal/preflight holds every test that inspects the
      # REAL tracked tree, and all four of them govern Markdown:
      #
      #   TestSourceFilesAreCleanUTF8              mojibake in .go AND .md
      #   TestGoCommentsHaveNoLiteralUnicodeEscapes  literal \uXXXX in comments
      #   TestSkillIncludes_WorkingTreeIsClean     dead <!-- include: --> targets
      #   TestSkillPortability_WorkingTreeIsClean  .vscode paths in skills/*.md
      #
      # `go test ./...` is their only enforcement path — skill_includes_test.go
      # says so in as many words — so gating the Test step on run_heavy took the
      # repo's only automated `.md` guards offline for docs_only PRs, and a
      # SKILL.md or docs/ edit is exactly a docs_only PR. Nothing else in the 12
      # required checks covers it: a C1 control is valid UTF-8, so Prettier
      # reformats around it and check-md-links.sh never looks at bytes. A
      # mojibake docs sweep would have merged with all checks green and turned
      # `main` red on the push run, which is the prediction-vs-observation gap
      # AGENTS.md forbids. ~1s: the step above already warmed the build cache
      # for this package (internal/preflight is in cmd/nightgauge's graph).
      - name: Working-tree content guards (encoding, skill includes, portability)
        run: go test ./internal/preflight/ -count=1
      # DELIBERATELY UNGATED, same reasoning as the two steps above: the drift
      # this catches is introduced by editing api/platform-operations.yaml or
      # hand-editing the generated registry, and neither is guaranteed to trip
      # run_heavy. operations.gen.go carries each platform operation's credential
      # requirement — the fact the platform's OpenAPI document cannot express and
      # the one the conformance test in internal/platform checks call sites
      # against (#750). A stale copy silently weakens that check. ~2s.
      - name: Platform operation registry in sync
        run: make check-platform-operations
      - name: Build
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: go build ./...
      - name: Vet
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: go vet ./...
      - name: Gofmt
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: |
          UNFORMATTED="$(gofmt -l ./internal ./cmd)"
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$UNFORMATTED"
            exit 1
          fi
      # -json so the skip accounting below has something to read. A package
      # whose tests all SKIPPED still prints `ok`, so without this step a guard
      # that has stopped guarding is indistinguishable from one that passed
      # (#474).
      - name: Test
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: |
          set -o pipefail
          go test -json ./... -count=1 | tee go-test.json | python3 scripts/go-test-json-echo.py
          python3 scripts/check-go-test-skips.py go-test.json
      # Whole-tree -race (#493), replacing the internal/orchestrator-scoped step
      # #428 landed — one race step, not two. The scoped step existed because
      # nothing else detects a drainBackground() join being deleted from a test
      # body: the tests pass with or without it, which is why that flake stayed
      # invisible. That argument was never specific to one package.
      #
      # Measured on this branch, whole tree, Apple M-series: 2m48s plain vs
      # 2m58s with -race — about +6%, not the ~3x the scoped step's comment
      # predicted, because the suite is dominated by subprocess and filesystem
      # work rather than by instrumented Go. Zero DATA RACE reports over 108
      # packages, so the gate arrives green; #490 and #491 are blockers for the
      # -count=5 soak, not for this per-PR step.
      - name: Test (race, whole tree)
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: go test -race -count=1 ./...
      # The shell-side decision procedure AGENTS.md § Clean up on merge
      # defers to for `git branch -D` calls, kept aligned with the Go sweep's
      # own ancestry-acceptance door (#593). No npm/node needed, so it runs
      # here rather than in lint.yml.
      - name: branch-merged-check.sh regression suite
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: bash scripts/test-branch-merged-check.sh

  # The Node suite (~15.5k tests) is split into two parallel jobs so it fits the
  # window on 2-core runners. `npm ci` needs no registry auth: the tree vendors
  # its generated platform types and depends on no private packages.
  sdk:
    name: SDK build & test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure git identity
        # Identity is scoped to a per-job file via GIT_CONFIG_GLOBAL.
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: |
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig"
          git config --global user.email "ci@nightgauge.dev"
          git config --global user.name "Nightgauge CI"
          git config --global init.defaultBranch main
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
      # setup-node is gated with the rest: `npm ci` is this job's dominant cost
      # (~62s of its ~99s), and restoring an npm cache for an install that will
      # not happen is pure runner time.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: npm ci
      - name: Build
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: npm run build
      - name: Test (SDK)
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: npm run -w @nightgauge/sdk test

  vscode:
    name: VSCode build & test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure git identity (tests create local repos)
        # Identity is scoped to a per-job file via GIT_CONFIG_GLOBAL.
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: |
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig"
          git config --global user.email "ci@nightgauge.dev"
          git config --global user.name "Nightgauge CI"
          git config --global init.defaultBranch main
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
      # #865: setup-node, Install and the SDK build are DELIBERATELY UNGATED,
      # because the typecheck step below is ungated and cannot run without
      # them. Gating them while leaving the typecheck ungated made every
      # docs-only PR fail on `TS2688: Cannot find type definition file for
      # 'node'` — the step that exists to survive a docs-only classification
      # was guaranteed to fail on exactly that classification.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      # `typecheck:tests` resolves `@nightgauge/sdk` from the SDK's built
      # `dist/**` type declarations, so the types must exist even when the
      # full build below is skipped. Without this the docs-only path trades
      # the TS2688 failures for a wall of TS2307 "Cannot find module
      # '@nightgauge/sdk'" — the same failure, one layer down.
      - name: Build SDK types (needed by the ungated test-tree typecheck)
        run: npm run build --workspace=@nightgauge/sdk
      # The full root build — extension bundle, marketplace assets, notices —
      # stays gated. That is the expensive part fast-track exists to skip.
      - name: Build
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: npm run build
      # #499: tsconfig.json covers src/** only, vitest transforms through
      # esbuild (transpile-only), and eslint has no `project` for tests — so
      # tests/** and the Playwright fixtures were typechecked by nothing.
      # Deliberately NOT gated on run_heavy: this is seconds, and a type error
      # in a test is exactly the drift a docs-only classification would let
      # through.
      - name: Typecheck test tree (VSCode)
        run: npm run -w nightgauge-vscode typecheck:tests
      - name: Test (VSCode)
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: npm run -w nightgauge-vscode test
      - name: Generated VSCode contributions in sync
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: npx -w nightgauge-vscode tsx scripts/generate-package-contributions.ts --check
      - name: "@types/vscode <= engines.vscode (vsce packaging invariant)"
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: node packages/nightgauge-vscode/scripts/check-engine-types.mjs

  # Browser-driven webview tests (tests/playwright/**, *.playwright.ts). Split
  # from `vscode` rather than folded into its `npm run test` step: vitest and
  # Playwright are different runners with different collection rules (#744 —
  # before this job existed, 61 Playwright tests and 3 more-orphaned e2e-only
  # files ran in NO CI workflow at all, so a regression across any of them
  # reached `main` unnoticed). Same triggers and same changes-gate shape as
  # `vscode`; only the browser install differs.
  playwright:
    name: Playwright webview tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: npm ci
      # `test:e2e` runs generate-dashboard-html.ts, which imports the real tab
      # renderers — and those import @nightgauge/sdk. Without a build the SDK
      # has no dist/, so tsx dies on ERR_MODULE_NOT_FOUND before Playwright
      # ever starts. It passes locally only because a previous build left
      # dist/ behind; a clean runner has nothing.
      - name: Build
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: npm run build
      # The browser binary (not the npm package) is the expensive part of
      # `playwright install`, so it is cached by Playwright's own version —
      # a version bump invalidates the cache and re-downloads, exactly what
      # is wanted. `install-deps` (apt-level OS libraries) is NOT cached: the
      # runner image is ephemeral per job regardless of cache-hit, so it must
      # run every time — only the browser binary download is conditional.
      - name: Get Playwright version
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        id: playwright-version
        run: echo "version=$(node -p "require('./packages/nightgauge-vscode/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser binary
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browser (chromium, cache miss)
        if: ${{ needs.changes.outputs.run_heavy != 'false' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: npx -w nightgauge-vscode playwright install --with-deps chromium
      - name: Install Playwright OS dependencies (cache hit)
        if: ${{ needs.changes.outputs.run_heavy != 'false' && steps.playwright-cache.outputs.cache-hit == 'true' }}
        run: npx -w nightgauge-vscode playwright install-deps chromium
      # test:e2e generates the real dashboard HTML fixture
      # (DashboardInteractions.playwright.ts loads it from /tmp) before
      # running the suite — a bare `playwright test` skips that prerequisite
      # and 23 of the 80 tests fail on a missing file.
      - name: Test (Playwright)
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: npm run -w nightgauge-vscode test:e2e
      # Dashboard fixture screenshots (tests/playwright/dashboard/Screenshots.playwright.ts,
      # Issue #751) — one per tab/state fixture, uploaded unconditionally so a
      # visual regression is reviewable on a GREEN run too, not only a failed
      # one. Deliberately a separate step from the failure-only upload below:
      # that one is Playwright's own screenshot/trace/video-on-failure output,
      # this one is the always-captured tab/state matrix.
      - name: Upload dashboard fixture screenshots
        if: ${{ always() && needs.changes.outputs.run_heavy != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-fixture-screenshots
          path: packages/nightgauge-vscode/test-results/dashboard-screenshots/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload Playwright failure artifacts (screenshots, traces, video)
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: packages/nightgauge-vscode/test-results/
          retention-days: 7

  # VSCode extension host smoke tier (tests/vscode-host/**, #745). Launches a
  # real, headless VSCode, activates the extension against a throwaway
  # workspace, reconciles contributed against registered commands, opens all
  # twelve webview panels and resolves all seven tree views.
  #
  # Its own job for the same reason `playwright` is: a third runner with its
  # own collection rules and its own OS prerequisites. `vscode` runs vitest
  # against mocked `vscode` modules and can never answer "does the extension
  # come up"; before this job, no workflow in the repository ever activated it.
  #
  # `xvfb-run` is not optional and is not a fallback. Electron needs an X
  # server, and there is deliberately no "no display, skip" branch anywhere in
  # the tier — a smoke tier that skips itself is worse than no smoke tier,
  # because it reports green. The launcher additionally fails when the in-host
  # module wrote no transcript, so a VSCode that dies before running the tests
  # cannot exit 0.
  vscode-host:
    name: VSCode host smoke tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: npm ci
      # The host loads `dist/extension.cjs`, not `src/` — an unbuilt tree
      # produces a window with no extension in it, and the launcher refuses
      # to start rather than reporting an empty pass.
      - name: Build
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: npm run build
      - name: Install xvfb
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Test (VSCode host)
        if: ${{ needs.changes.outputs.run_heavy != 'false' }}
        run: xvfb-run --auto-servernum npm run -w nightgauge-vscode test:host

  # Security & license gates. Runs on every PR, including forks — a fork cannot
  # ship a vulnerable stdlib or a copyleft/proprietary dependency into a release
  # without this job going red.
  #
  # DELIBERATELY NOT change-class gated (#647). govulncheck's answer is a
  # function of the advisory database as much as of the diff, so "the diff
  # cannot have introduced a vulnerability" does not imply "there is no new
  # vulnerability to find". At 60s it is a tenth of the matrix's cost and the
  # only unconditional supply-chain signal on a pull request; trading a
  # standing security gate for a minute is the wrong side of that exchange.
  security:
    name: Security & license gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Go vulnerability scan (govulncheck)
        # Fails on any stdlib/dependency vulnerability reachable from the code.
        # Unreachable ones are reported but do not gate -- that distinction is
        # the whole reason to use govulncheck rather than a plain
        # dependency-version check. CodeQL's Go coverage is not a superset of
        # this: govulncheck adds known CVEs in dependencies, filtered by
        # whether the vulnerable symbol is actually reachable.
        #
        # gosec was evaluated and deliberately NOT gated here. It reports 614
        # findings (38 HIGH) on this tree, dominated by G304/G204 -- reading
        # user-supplied paths and launching user-configured subprocesses, which
        # is what a local CLI does by definition. Its single command-injection
        # finding is exec.Command($EDITOR, path), which runs no shell. Gating
        # on that would mean baselining ~600 findings first, and a scanner that
        # is red on day one trains everyone to ignore it.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Go dependency-license gate (go-licenses)
        # Blocks proprietary (forbidden) and GPL/AGPL-family (restricted)
        # licenses. Reciprocal (MPL-2.0, file-level copyleft) is allowed — it is
        # compatible with Apache-2.0 redistribution and present transitively via
        # go-git (filepath-securejoin). modernc.org/mathutil is BSD-3-Clause but
        # its LICENSE file defeats go-licenses' detector, so it is ignored.
        run: |
          go install github.com/google/go-licenses@v1.6.0
          "$(go env GOPATH)/bin/go-licenses" check ./cmd/nightgauge \
            --disallowed_types=forbidden,restricted \
            --ignore modernc.org/mathutil
      - name: npm vulnerability gate
        run: node scripts/npm-audit-check.js
      - name: npm dependency-license gate (publishable packages)
        # Scans the two packages that actually ship (SDK, VSCode extension);
        # fails on any copyleft/proprietary production license.
        run: |
          DENY='GPL-1.0;GPL-2.0;GPL-3.0;LGPL-2.0;LGPL-2.1;LGPL-3.0;AGPL-1.0;AGPL-3.0;SSPL-1.0;CC-BY-NC-4.0;UNLICENSED'
          npx license-checker --production --start packages/nightgauge-sdk --failOn "$DENY"
          npx license-checker --production --start packages/nightgauge-vscode --failOn "$DENY"
      - name: License-header guard (source + build output)
        run: bash scripts/check-license-headers.sh
