# Lint — formatting, ESLint, license-header guard, skill metadata.
name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Prettier (format check)
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: License-header guard (no proprietary markers)
        run: bash scripts/check-license-headers.sh
      - name: SKILL.md metadata
        run: bash scripts/validate-skill-metadata.sh
      # Band-vocabulary reintroduction gate (#582): fails on hand-inlined band
      # closed sets / regex alternations in production source outside the
      # allowed surfaces (spike #568 §5). Self-test first — a gate nothing
      # exercises degrades into an unconditional pass (the #539/#549 lesson).
      - name: Band-vocabulary gate self-test
        run: bash scripts/test-band-vocabulary-check.sh
      - name: Band-vocabulary reintroduction gate
        run: python3 scripts/check-band-vocabulary.py
      # Proves the gate below still FAILS CLOSED rather than passing vacuously
      # — the defect #539 exists to fix. Runs BEFORE it: the suite works
      # entirely in throwaway temp repos, so it is safe here, and putting it
      # after would break the mutation-is-last invariant. Without this step,
      # reverting the gate to `git diff --exit-code` or to `exit 0` produces a
      # fully green build, which is #529 all over again.
      - name: Mirror drift gate self-test
        run: bash scripts/test-mirror-drift-gate.sh
      # MUST stay the LAST step of this job. The generator MUTATES the
      # checkout — it `rm -rf`s every non-`_shared` mirror subdirectory and
      # rsyncs with --delete — so any step after it would run against a
      # rewritten tree. #529 shipped three canonical-only overlay files
      # because nothing ran this at all.
      - name: Plugin skills mirror in sync
        run: bash scripts/install-agent-skills.sh --generate-only

  link-check:
    # Validates cross-document reference integrity across root *.md + docs/**
    # (config + scope: .markdown-link-check.json). Standing gate from #135.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Markdown link check (docs cross-references)
        run: bash scripts/check-md-links.sh
