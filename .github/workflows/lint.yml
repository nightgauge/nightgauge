# Lint — formatting, ESLint, license-header guard, skill metadata.
name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Prettier (format check)
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: License-header guard (no proprietary markers)
        run: bash scripts/check-license-headers.sh
      - name: SKILL.md metadata
        run: bash scripts/validate-skill-metadata.sh
      # Band-vocabulary reintroduction gate (#582): fails on hand-inlined band
      # closed sets / regex alternations in production source outside the
      # allowed surfaces (spike #568 §5). Self-test first — a gate nothing
      # exercises degrades into an unconditional pass (the #539/#549 lesson).
      - name: Band-vocabulary gate self-test
        run: bash scripts/test-band-vocabulary-check.sh
      - name: Band-vocabulary reintroduction gate
        run: python3 scripts/check-band-vocabulary.py
      # Issue-body heading contract (#711): the per-type required-heading table
      # lives in three files and issue-create runs issue-audit as its own
      # terminal gate, so a drifted copy makes every authored issue fail its own
      # audit. Self-test first — a gate nothing exercises degrades into an
      # unconditional pass (the #539/#549 lesson).
      - name: Issue-body contract gate self-test
        run: bash scripts/test-issue-body-contract.sh
      - name: Issue-body heading contract
        run: python3 scripts/check-issue-body-contract.py
      # Stale-visibility-prose reintroduction gate (#697): fails on a tracked
      # artifact unconditionally asserting this repository is private — the
      # exact shape all four #697 instances took. Legitimate conditional
      # prose ("...while the repo is private", codeql.yml/release.yml) is
      # exempt; only a flat assertion of the current value goes stale.
      - name: Visibility-prose reintroduction gate
        run: python3 scripts/check-visibility-prose.py
      # Nonexistent-workflow-reference gate (#545): three workflows were named
      # across docs, an ADR, Go comments and two shell libraries as though they
      # enforced something in CI, and none had ever existed. Self-test first —
      # a gate nothing exercises degrades into an unconditional pass (the
      # #539/#549 lesson).
      - name: Workflow-reference gate self-test
        run: bash scripts/test-workflow-refs-check.sh
      - name: Nonexistent-workflow-reference gate
        run: python3 scripts/check-workflow-refs.py
      # Proves the gate below still FAILS CLOSED rather than passing vacuously
      # — the defect #539 exists to fix — and that it fails only on the
      # invariant it names (#546). Without this step, reverting the gate to
      # `git diff --exit-code` or to `exit 0` produces a fully green build,
      # which is #529 all over again.
      - name: Mirror drift gate self-test
        run: bash scripts/test-mirror-drift-gate.sh
      # Read-only, and free to sit anywhere in this job: `--check-mirror`
      # regenerates into a temp destination and compares the two trees — paths,
      # contents, symlink targets and the executable bit git tracks — so it
      # never writes the checkout (#546 — the previous `--generate-only` form
      # rewrote the mirror in place, which is what pinned it to last position).
      # #529 shipped three canonical-only overlay files because nothing ran a
      # check like this at all.
      - name: Plugin skills mirror in sync
        run: bash scripts/install-agent-skills.sh --check-mirror
      # The question the step above structurally cannot ask (#831): it compares
      # the mirror to the generator's own output, so a link the generator copied
      # verbatim into a directory two levels deeper was dead on BOTH sides and
      # the gate stayed green. Self-test first, so a gate that stopped failing
      # closed is caught before its verdict is believed.
      - name: Mirror link gate self-test
        run: bash scripts/test-mirror-link-check.sh
      - name: Mirror link integrity
        run: python3 scripts/check-mirror-links.py
      # CLA gate regression suite (#976): .github/scripts/cla-check.test.mjs
      # existed but no workflow, npm script or ci-local.sh step ever ran it, so
      # it was structurally incapable of going red. It spawns the real
      # cla-check.mjs against a local HTTP stub — no Go toolchain, no network —
      # and lint.yml already has setup-node + `npm ci` and runs unconditionally.
      # Use the explicit file path: `node --test .github/scripts/` would try to
      # execute cla-check.mjs itself and fail on the missing environment.
      - name: CLA gate regression suite
        run: node --test .github/scripts/cla-check.test.mjs

  link-check:
    # Validates cross-document reference integrity across root *.md + docs/**
    # (config + scope: .markdown-link-check.json). Standing gate from #135.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Markdown link check (docs cross-references)
        run: bash scripts/check-md-links.sh
