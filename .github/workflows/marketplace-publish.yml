# VS Code Marketplace publish (Gate 2), on demand — #1299.
#
# This is the ONLY Marketplace / Open VSX publish path. release.yml builds the
# per-target VSIXs and attaches them to the GitHub Release; it never publishes
# to a registry. This workflow promotes those exact files (#2151): it downloads
# the tag's release VSIXs, verifies each against the release's checksums.txt
# and its release.yml provenance attestation, checks version and channel,
# verifies the PAT, and publishes. It builds nothing, so the registries serve
# the same SHA-256 the release records. It is re-runnable on its own and never
# touches the GitHub Release or the Homebrew tap. Run release.yml first.
#
# Dispatch it ON THE TAG, never from a branch:
#
#   gh workflow run marketplace-publish.yml --ref v0.2.2 -f registries=both
#
# The tag is the run's own ref (`github.ref`), not a free-text input, for three
# reasons: the tag selects the GitHub Release to promote and the attestation
# source ref every VSIX must carry (refs/tags/<tag>); the
# `production` environment's tag-only branch policy applies, exactly as it does
# to release.yml; and the workflow definition that runs is the one at the tag,
# so a publish is reproducible against the tagged tree. A fix to this file
# therefore ships by tagging the fix, which is the correct unit anyway.
#
# Secrets: VSCE_PAT (Azure DevOps PAT, Marketplace: Manage, all accessible
# organizations, owned by a member of the `nightgauge` publisher) and OVSX_PAT
# (an Open VSX access token for the `nightgauge` namespace).
name: Marketplace publish

on:
  workflow_dispatch:
    inputs:
      registries:
        description: "Where to publish"
        required: true
        default: "marketplace"
        type: choice
        options:
          - marketplace
          - open-vsx
          - both

permissions:
  contents: read

# Pin the timezone so anything wall-clock-formatted is deterministic regardless
# of runner locale (same as ci.yml and release.yml).
env:
  TZ: UTC

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Promote ${{ github.ref_name }} release VSIXs to ${{ inputs.registries }}
    # Linux: nothing is built or signed here any more, so macOS (needed for
    # `codesign` in release.yml) buys nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `production` environment admits `v*` tag refs only, so a dispatch
    # from a branch is refused by GitHub before a runner is assigned -- the
    # same gate release.yml runs behind.
    environment: production

    permissions:
      contents: read
      attestations: read # verify release.yml's provenance attestations

    steps:
      - name: Require a stable release tag as the run's ref
        # Fails before anything is checked out: the environment policy above
        # already refuses branches, and this rejects rc tags (the Marketplace
        # publishes release tags only; registry channel is derived from the
        # numeric version, not by tag suffix) and anything that is not vX.Y.Z.
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$REF_TYPE" == "tag" ]] || { echo "::error::dispatch this workflow on a release tag (--ref vX.Y.Z), not '$TAG' ($REF_TYPE)"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a stable release tag (vX.Y.Z); rc tags are not published"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; do not leave a token in .git/config for npm
          # postinstall scripts or the packaging tools to find.
          persist-credentials: false
          fetch-depth: 0

      - name: Ensure full working tree
        run: |
          git sparse-checkout disable 2>/dev/null || true
          git checkout -- . 2>/dev/null || true

      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # The checkout is the tag by construction; assert it rather than trust it.
          [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$SHA" ]] || { echo "ERROR: checkout $SHA is not tag $TAG"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Verify the PAT BEFORE touching the artifacts, and fail loudly:
      # this workflow exists only to publish, so a missing or invalid PAT is
      # an error here, not a skip.
      - name: Verify VSCE_PAT against the publisher
        if: ${{ inputs.registries == 'marketplace' || inputs.registries == 'both' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          PUBLISHER=$(node -p "require('./packages/nightgauge-vscode/package.json').publisher")
          [[ -n "${VSCE_PAT:-}" ]] || { echo "::error::VSCE_PAT secret is not set"; exit 1; }
          # Azure DevOps intermittently times out /_apis/securityroles (seen on
          # the v0.4.0 publish, #1599). A transient timeout is not a bad PAT,
          # so retry before failing.
          for attempt in 1 2 3 4 5; do
            if npx --yes @vscode/vsce@3.9.2 verify-pat "$PUBLISHER"; then exit 0; fi
            echo "::warning::verify-pat attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "::error::VSCE_PAT verification failed after 5 attempts"
          exit 1

      # Open VSX (#1316): the namespace is the same identifier as the
      # Marketplace publisher. Verified up front for the same reason.
      - name: Verify OVSX_PAT against the namespace
        if: ${{ inputs.registries == 'open-vsx' || inputs.registries == 'both' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          NAMESPACE=$(node -p "require('./packages/nightgauge-vscode/package.json').publisher")
          [[ -n "${OVSX_PAT:-}" ]] || { echo "::error::OVSX_PAT secret is not set"; exit 1; }
          # Same transient-timeout retry as the Marketplace step above.
          for attempt in 1 2 3 4 5; do
            if npx --yes ovsx@1.2.0 verify-pat "$NAMESPACE"; then exit 0; fi
            echo "::warning::verify-pat attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "::error::OVSX_PAT verification failed after 5 attempts"
          exit 1

      # Build once, promote the same bytes (#2151). The registries get the
      # exact VSIXs release.yml built, scanned, attested and attached to the
      # GitHub Release, so the digest a user verifies against the release's
      # checksums.txt is the digest the Marketplace and Open VSX serve. Nothing
      # is compiled, packaged, rescanned or re-attested here. release.yml
      # packages with the same channel resolver (marketplace-channel.sh), so
      # the pre-release flag vsce bakes in at package time is already right.
      - name: Download the release's VSIXs and checksums
        working-directory: packages/nightgauge-vscode
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "nightgauge-vscode-*-${VERSION}.vsix" --pattern checksums.txt
          shopt -s nullglob
          VSIXES=(./*.vsix)
          [[ "${#VSIXES[@]}" -eq 3 ]] || { echo "::error::expected 3 per-target VSIXs on release $TAG, found ${#VSIXES[@]}"; exit 1; }
          printf '%s\n' "${VSIXES[@]}"

      # Each VSIX must be the byte-identical file the release recorded, carry
      # a provenance attestation signed by release.yml for this tag, and name
      # the tag's version and channel in its manifest. Any mismatch stops the
      # run before a single registry call.
      - name: Verify digest, provenance and channel of each VSIX
        working-directory: packages/nightgauge-vscode
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          CHANNEL_NAME="$(bash "$GITHUB_WORKSPACE/scripts/marketplace-channel.sh" "$VERSION")"
          for VSIX in ./*.vsix; do
            VSIX="${VSIX#./}"
            EXPECTED=$(awk -v f="$VSIX" '$2 == f { print $1 }' checksums.txt)
            [[ -n "$EXPECTED" ]] || { echo "::error::$VSIX is not listed in the release's checksums.txt"; exit 1; }
            ACTUAL=$(shasum -a 256 "$VSIX" | awk '{ print $1 }')
            [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "::error::$VSIX digest $ACTUAL does not match checksums.txt ($EXPECTED)"; exit 1; }
            if [[ "${{ github.event.repository.private }}" != "true" ]]; then
              gh attestation verify "$VSIX" --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-ref "refs/tags/$TAG"
            fi
            MANIFEST=$(unzip -p "$VSIX" extension.vsixmanifest)
            grep -q "Version=\"$VERSION\"" <<<"$MANIFEST" \
              || { echo "::error::$VSIX manifest does not carry version $VERSION"; exit 1; }
            if grep -q 'Microsoft.VisualStudio.Code.PreRelease" Value="true"' <<<"$MANIFEST"; then
              PACKAGED=pre-release
            else
              PACKAGED=release
            fi
            [[ "$PACKAGED" == "$CHANNEL_NAME" ]] \
              || { echo "::error::$VSIX was packaged as $PACKAGED but $VERSION resolves to $CHANNEL_NAME"; exit 1; }
            echo "OK: $VSIX sha256=$ACTUAL channel=$PACKAGED"
          done
          rm checksums.txt

      # --- VS Code Marketplace ---
      # The PAT was VERIFIED against the publisher in the "Verify VSCE_PAT
      # against the publisher" step above, before any artifact was fetched;
      # this workflow exists only to publish, so there is no skip branch. The
      # `secrets` context cannot be used in a step-level `if:` — GitHub rejects
      # the whole workflow at load time — so do NOT gate this step on
      # `secrets.VSCE_PAT`.
      - name: Publish per-target VSIXs to VS Code Marketplace
        if: ${{ inputs.registries == 'marketplace' || inputs.registries == 'both' }}
        working-directory: packages/nightgauge-vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Even 0.x minor lines are releases; odd 0.x minor lines are previews.
          # This follows Marketplace numeric-version ordering guidance and lets
          # 0.4.0 install normally without presenting beta maturity as GA.
          CHANNEL=()
          CHANNEL_NAME="$(bash "$GITHUB_WORKSPACE/scripts/marketplace-channel.sh" "$VERSION")"
          if [[ "$CHANNEL_NAME" == "pre-release" ]]; then
            CHANNEL=(--pre-release)
            echo "Version $VERSION → publishing to the pre-release channel"
          else
            echo "Version $VERSION → publishing to the stable channel"
          fi
          # Each .vsix carries its targetPlatform in the manifest, so vsce
          # publishes it for the right platform without re-specifying --target.
          # Same idempotent, retrying helper as the Open VSX step: a partial
          # release is the failure mode worth engineering against.
          bash "$GITHUB_WORKSPACE/scripts/publish-vsix-set.sh" \
            marketplace "$VERSION" ${CHANNEL[@]+"${CHANNEL[@]}"}

      - name: Publish per-target VSIXs to Open VSX
        if: ${{ inputs.registries == 'open-vsx' || inputs.registries == 'both' }}
        working-directory: packages/nightgauge-vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Apply the same channel contract as the Marketplace.
          CHANNEL=()
          CHANNEL_NAME="$(bash "$GITHUB_WORKSPACE/scripts/marketplace-channel.sh" "$VERSION")"
          if [[ "$CHANNEL_NAME" == "pre-release" ]]; then
            CHANNEL=(--pre-release)
            echo "Version $VERSION → publishing to Open VSX as pre-release"
          else
            echo "Version $VERSION → publishing to Open VSX as release"
          fi
          # Idempotent and retrying: a transient 5xx mid-loop used to abort the
          # step and leave a partial release that a re-run could not repair.
          bash "$GITHUB_WORKSPACE/scripts/publish-vsix-set.sh" \
            open-vsx "$VERSION" ${CHANNEL[@]+"${CHANNEL[@]}"}
