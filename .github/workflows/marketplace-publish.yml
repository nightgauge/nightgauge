# VS Code Marketplace publish (Gate 2), on demand — #1299.
#
# This is the ONLY Marketplace / Open VSX publish path. release.yml builds the
# per-target VSIXs and attaches them to the GitHub Release; it never publishes
# to a registry. This workflow is re-runnable on its own: build the per-target
# binaries and VSIXs exactly as release.yml does (pre-release for 0.x), verify
# the PAT against the publisher, attest, publish. It never touches the GitHub
# Release or the Homebrew tap.
#
# Dispatch it ON THE TAG, never from a branch:
#
#   gh workflow run marketplace-publish.yml --ref v0.2.2 -f registries=both
#
# The tag is the run's own ref (`github.ref`), not a free-text input, for three
# reasons: the build-provenance attestation then names the tag's commit as the
# source (a dispatch from `main` would attest whatever `main` pointed at); the
# `production` environment's tag-only branch policy applies, exactly as it does
# to release.yml; and the workflow definition that runs is the one at the tag,
# so a publish is reproducible against the tagged tree. A fix to this file
# therefore ships by tagging the fix, which is the correct unit anyway.
#
# Secrets: VSCE_PAT (Azure DevOps PAT, Marketplace: Manage, all accessible
# organizations, owned by a member of the `nightgauge` publisher) and OVSX_PAT
# (an Open VSX access token for the `nightgauge` namespace).
name: Marketplace publish

on:
  workflow_dispatch:
    inputs:
      registries:
        description: "Where to publish"
        required: true
        default: "marketplace"
        type: choice
        options:
          - marketplace
          - open-vsx
          - both

permissions:
  contents: read

# Pin the timezone so anything wall-clock-formatted is deterministic regardless
# of runner locale (same as ci.yml and release.yml).
env:
  TZ: UTC

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Package ${{ github.ref_name }} and publish (${{ inputs.registries }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The `production` environment admits `v*` tag refs only, so a dispatch
    # from a branch is refused by GitHub before a runner is assigned -- the
    # same gate release.yml runs behind.
    environment: production

    permissions:
      contents: read
      id-token: write # artifact attestations (OIDC)
      attestations: write # artifact attestations

    steps:
      - name: Require a stable release tag as the run's ref
        # Fails before anything is checked out: the environment policy above
        # already refuses branches, and this rejects rc tags (the Marketplace
        # publishes stable tags only; 0.x lands on the pre-release channel by
        # version, not by tag suffix) and anything that is not vX.Y.Z.
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$REF_TYPE" == "tag" ]] || { echo "::error::dispatch this workflow on a release tag (--ref vX.Y.Z), not '$TAG' ($REF_TYPE)"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a stable release tag (vX.Y.Z); rc tags are not published"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; do not leave a token in .git/config for npm
          # postinstall scripts or the packaging tools to find.
          persist-credentials: false
          fetch-depth: 0

      - name: Ensure full working tree
        run: |
          git sparse-checkout disable 2>/dev/null || true
          git checkout -- . 2>/dev/null || true

      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Clear stale npx cache (arm64/x64 esbuild mismatch)
        run: rm -rf ~/.npm/_npx

      - name: Install dependencies
        run: npm ci

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # The checkout is the tag by construction; assert it rather than trust it.
          [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$SHA" ]] || { echo "ERROR: checkout $SHA is not tag $TAG"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Verify the PAT BEFORE spending minutes on a build, and fail loudly:
      # this workflow exists only to publish, so a missing or invalid PAT is
      # an error here, not a skip.
      - name: Verify VSCE_PAT against the publisher
        if: ${{ inputs.registries == 'marketplace' || inputs.registries == 'both' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          PUBLISHER=$(node -p "require('./packages/nightgauge-vscode/package.json').publisher")
          [[ -n "${VSCE_PAT:-}" ]] || { echo "::error::VSCE_PAT secret is not set"; exit 1; }
          npx --yes @vscode/vsce@3.9.1 verify-pat "$PUBLISHER"

      # Open VSX (#1316): the namespace is the same identifier as the
      # Marketplace publisher. Verified before the build for the same reason.
      - name: Verify OVSX_PAT against the namespace
        if: ${{ inputs.registries == 'open-vsx' || inputs.registries == 'both' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          NAMESPACE=$(node -p "require('./packages/nightgauge-vscode/package.json').publisher")
          [[ -n "${OVSX_PAT:-}" ]] || { echo "::error::OVSX_PAT secret is not set"; exit 1; }
          npx --yes ovsx@1.1.1 verify-pat "$NAMESPACE"

      # Cross-compile every target binary up front so each platform-specific
      # .vsix can bundle the matching one. The extension loads its Go binary from
      # the bundled dist/bin/ (no runtime download), so a single universal .vsix
      # would ship one arch and break on the others. `make build-all` emits
      # bin/nightgauge-{darwin-arm64,darwin-amd64,linux-amd64}.
      - name: Build all Go binaries (per-target VSIX bundling)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make build-all VERSION="$VERSION"

      # Build EVERY workspace before testing, not just the SDK. The VSCode suite
      # has an integration test (tests/integration/failureTaxonomyPackaging.test.ts)
      # asserting `dist/failure-taxonomy.yaml` exists — a file only the extension's
      # own `build:assets` step produces. Building the SDK alone left it absent, so
      # `Run tests` could never pass here. ci.yml does not hit this because its
      # VSCode job runs the root `npm run build` before testing.
      # Tests are not re-run here: they already ran in the tag's release run.
      - name: Build all workspaces (SDK + extension assets)
        run: npm run build

      - name: Inject release version
        working-directory: packages/nightgauge-vscode
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Split the canonical `npm run package` (build + vsce package) so we can
      # stamp `dist/build-info.json` AFTER the build pipeline writes into
      # `dist/` but BEFORE `vsce package` freezes it. Before legacy issue 3650 the stamp ran
      # earlier and any future `dist/` rewrite (rm -rf in clean step, new
      # asset path) could silently omit it from the .vsix and leave
      # ExtensionStalenessService stuck in `state: "unknown"` on the
      # installed extension. legacy issue 3650 (Part B).
      - name: Build extension (pre-package)
        working-directory: packages/nightgauge-vscode
        run: npm run build

      # Legacy issues 3300 / 3650: stamp build provenance so ExtensionStalenessService
      # can detect when the running extension is behind workspace HEAD and
      # refuse autonomous dispatch on critical-path drift. Stamping happens
      # AFTER `npm run build` so dist/ already exists in its final shape, and
      # the helper script asserts the file is parseable JSON before we
      # continue — a missing stamp is a hard fail, not a silent skip.
      - name: Stamp build provenance
        env:
          BUILD_BRANCH: ${{ github.ref_name }}
        run: |
          DIST=packages/nightgauge-vscode/dist
          BUILD_SHA=$(git rev-parse HEAD)
          COMMIT_TIMESTAMP=$(git log -1 --format=%cI HEAD)
          BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > "$DIST/build-info.json" <<EOF_BUILD_INFO
          {
            "commitSha": "$BUILD_SHA",
            "branch": "$BUILD_BRANCH",
            "commitTimestamp": "$COMMIT_TIMESTAMP",
            "buildTimestamp": "$BUILD_TIMESTAMP",
            "schemaVersion": "1"
          }
          EOF_BUILD_INFO
          echo "Stamped: $BUILD_SHA ($BUILD_BRANCH @ $COMMIT_TIMESTAMP)"
          bash packages/nightgauge-vscode/scripts/check-build-info.sh \
            "$DIST/build-info.json"

      # Package one .vsix PER VS Code target, each bundling the matching binary
      # swapped into dist/bin/. `vsce package --target <t>` names the file
      # nightgauge-vscode-<version>-<t>.vsix; the Marketplace serves the
      # correct one per user automatically. A single universal .vsix would ship
      # one arch and fail to launch the backend on every other platform.
      - name: Package per-target VSIXs
        working-directory: packages/nightgauge-vscode
        run: |
          set -euo pipefail
          # vsce target -> Makefile binary suffix (GOOS-GOARCH)
          declare -A BIN=(
            [darwin-arm64]=darwin-arm64
            [darwin-x64]=darwin-amd64
            [linux-x64]=linux-amd64
          )
          # vsce records the pre-release flag in the VSIX manifest at PACKAGE
          # time; `publish --pre-release` on a VSIX packaged without it is
          # refused (#1299). 0.x is pre-release, as the publish step says.
          VERSION="$(node -p "require('./package.json').version")"
          CHANNEL=()
          if [[ "${VERSION%%.*}" == "0" ]]; then
            CHANNEL=(--pre-release)
            echo "Version $VERSION is 0.x → packaging as pre-release"
          fi
          mkdir -p dist/bin
          for T in darwin-arm64 darwin-x64 linux-x64; do
            SRC="../../bin/nightgauge-${BIN[$T]}"
            [[ -f "$SRC" ]] || { echo "ERROR: missing $SRC (did 'make build-all' run?)"; exit 1; }
            cp "$SRC" dist/bin/nightgauge
            chmod +x dist/bin/nightgauge
            npx @vscode/vsce@3.9.1 package --no-dependencies --target "$T" ${CHANNEL[@]+"${CHANNEL[@]}"}
          done
          echo "Packaged:"; ls -1 *.vsix

      # Defense-in-depth: every .vsix must carry the build-info stamp AND a
      # bundled binary before it reaches the Marketplace — and must NOT ship
      # source maps or type declarations (.vscodeignore drift).
      - name: Verify VSIX contents
        working-directory: packages/nightgauge-vscode
        run: |
          set -euo pipefail
          shopt -s nullglob
          COUNT=0
          for VSIX in *.vsix; do
            COUNT=$((COUNT + 1))
            unzip -l "$VSIX" | grep -q 'extension/dist/build-info.json' \
              || { echo "ERROR: $VSIX missing build-info.json (ExtensionStalenessService would report 'unknown')"; exit 1; }
            unzip -l "$VSIX" | grep -q 'extension/dist/bin/nightgauge' \
              || { echo "ERROR: $VSIX missing bundled Go binary"; exit 1; }
            unzip -l "$VSIX" | grep -q 'extension/dist/sdk-cli.cjs' \
              || { echo "ERROR: $VSIX missing bundled SDK CLI"; exit 1; }
            if unzip -l "$VSIX" | grep -qE '\.(map|d\.ts)$'; then echo "ERROR: $VSIX ships source maps or type declarations"; exit 1; fi
            echo "OK: $VSIX"
          done
          [[ "$COUNT" -eq 3 ]] || { echo "ERROR: expected 3 per-target VSIXs, found $COUNT"; exit 1; }

      - name: Attest VSIXs
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/nightgauge-vscode/*.vsix

      # --- VS Code Marketplace ---
      # The PAT was VERIFIED against the publisher in the "Verify VSCE_PAT
      # against the publisher" step above, before any build work was spent;
      # this workflow exists only to publish, so there is no skip branch. The
      # `secrets` context cannot be used in a step-level `if:` — GitHub rejects
      # the whole workflow at load time — so do NOT gate this step on
      # `secrets.VSCE_PAT`.
      - name: Publish per-target VSIXs to VS Code Marketplace
        if: ${{ inputs.registries == 'marketplace' || inputs.registries == 'both' }}
        working-directory: packages/nightgauge-vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # 0.x ships on the Marketplace PRE-RELEASE channel (#1135,
          # docs/RELEASE_CHECKLIST.md P3): users opt in with "Install
          # Pre-Release Version" / `--pre-release`, and the listing carries the
          # Pre-Release badge. The flag drops on its own at v1.0.0.
          CHANNEL=()
          if [[ "${VERSION%%.*}" == "0" ]]; then
            CHANNEL=(--pre-release)
            echo "Version $VERSION is 0.x → publishing to the pre-release channel"
          else
            echo "Version $VERSION is ${VERSION%%.*}.x → publishing to the stable channel"
          fi
          # Each .vsix carries its targetPlatform in the manifest, so vsce
          # publishes it for the right platform without re-specifying --target.
          for VSIX in *.vsix; do
            echo "Publishing $VSIX"
            npx @vscode/vsce@3.9.1 publish --no-dependencies --packagePath "$VSIX" ${CHANNEL[@]+"${CHANNEL[@]}"}
          done

      - name: Publish per-target VSIXs to Open VSX
        if: ${{ inputs.registries == 'open-vsx' || inputs.registries == 'both' }}
        working-directory: packages/nightgauge-vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Same channel rule as the Marketplace: 0.x is a pre-release.
          CHANNEL=()
          if [[ "${VERSION%%.*}" == "0" ]]; then
            CHANNEL=(--pre-release)
            echo "Version $VERSION is 0.x → publishing to Open VSX as pre-release"
          fi
          for VSIX in *.vsix; do
            echo "Publishing $VSIX to Open VSX"
            npx --yes ovsx@1.1.1 publish "$VSIX" ${CHANNEL[@]+"${CHANNEL[@]}"}
          done

      - name: Upload the published VSIXs as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketplace-vsix-${{ steps.version.outputs.version }}
          path: packages/nightgauge-vscode/*.vsix
          retention-days: 90
