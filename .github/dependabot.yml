# Dependabot — Go modules, npm, and GitHub Actions weekly updates.
# Public repo: npm resolves from the public registry (no private registry / token).
# Review routing is handled by CODEOWNERS + branch protection (the `reviewers`
# key is deprecated).
#
# Version updates are LIVE. They were paused at limit 0 for the public-release
# cutover; the cutover is done, so the limits are restored to 5 as this file's
# own instructions directed.
#
# A pause with no expiry is indistinguishable from an outage: nothing tracked
# when this one should end, and it outlived its reason by months. If updates are
# ever paused again, set a date and an owner in this comment at the same time --
# not the pause without the expiry.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
      time: "09:00"
      timezone: America/Chicago
    labels:
      - dependencies
      - go
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    # Root workspace plus the two standalone skill lockfiles that are outside the
    # npm workspace graph and were otherwise un-scanned (#131).
    # Not listed: `/tests/clean-install/driver` (a plain-JavaScript extension
    # with no dependencies) and `/tests/clean-install/fixture` (a throwaway seed
    # repository -- it is what a stranger's project looks like, not ours).
    directories:
      - "/"
      - "/skills/nightgauge-product-audit"
      - "/claude-plugins/nightgauge/skills/product-audit"
    schedule:
      interval: daily
      time: "09:00"
      timezone: America/Chicago
    labels:
      - dependencies
      - npm
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    # `@types/vscode` is NOT a dependency chore. It is capped by
    # `engines.vscode` in packages/nightgauge-vscode/package.json, and
    # scripts/check-engine-types.mjs fails the build when it exceeds that cap --
    # a guard that exists because this exact bump regressed once already (#165).
    # Raising the ceiling drops support for older VSCode, which is a product
    # decision made deliberately in the same commit as `engines.vscode`.
    # Left un-ignored, Dependabot re-proposes it every run and takes the whole
    # grouped pull request down with it (#942 carried 18 unrelated updates).
    ignore:
      - dependency-name: "@types/vscode"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "09:00"
      timezone: America/Chicago
    labels:
      - dependencies
      - github-actions
    # Ungrouped, Dependabot opens one pull request per action PATH -- and two
    # paths of the same action are two pull requests. `codeql-action/init` and
    # `codeql-action/analyze` are pinned to one SHA and refuse to run against
    # each other ("Loaded a configuration file for version X, but running
    # version Y"), so splitting them made each half red by construction and
    # neither mergeable first (#938, #939). Grouping is what keeps an action
    # family in one commit.
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    # The Python the workflows install on hosted runners (PyYAML for the
    # publication-boundary guard and the two scheduled gates), pinned in
    # .github/requirements-ci.txt so a bump is a reviewed pull request.
    directory: /.github
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    # The clean-install gate image pins its base by digest; this keeps the
    # digest current.
    directory: /docker/clean-install
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    labels:
      - dependencies
      - docker
    open-pull-requests-limit: 5
