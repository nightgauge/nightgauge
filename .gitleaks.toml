[extend]
useDefault = true

# Publishing credentials the default ruleset misses (#1770). Other workspace
# repositories adopt these by copying both [[rules]] blocks into their own
# .gitleaks.toml; scripts/test-credential-scan-rules.sh is the proof they fire.

# Azure DevOps personal access tokens in the current format: 84 characters
# with the fixed JQQJ99 signature at offset 52. No default rule matches one,
# and VSCE_PAT (the Marketplace publishing token) is one.
[[rules]]
id = "azure-devops-pat"
description = "Azure DevOps personal access token (84 characters, JQQJ99 signature)"
regex = '''\b[A-Za-z0-9]{52}JQQJ99[A-Za-z0-9]{26}\b'''
keywords = ["jqqj99"]

# A literal value assigned to VSCE_PAT or OVSX_PAT, the release workflows'
# Marketplace and Open VSX publishing tokens. The default generic-api-key rule
# fires only when the name contains key, token, secret, pass and the like, and
# "PAT" is none of them. A `${{ secrets.VSCE_PAT }}` or `"$VSCE_PAT"`
# reference is not a literal and does not match.
[[rules]]
id = "vsce-ovsx-pat-assignment"
description = "Literal VS Code Marketplace (VSCE_PAT) or Open VSX (OVSX_PAT) publishing token"
regex = '''(?i)\b(?:VSCE|OVSX)_PAT\b["']?\s*(?::=|=>|[:=])\s*["']?([A-Za-z0-9._~+/=-]{20,})'''
secretGroup = 1
keywords = ["vsce_pat", "ovsx_pat"]

[[allowlists]]
description = "Synthetic credential-shaped regression fixtures"
regexTarget = "match"
regexes = [
  '''ghp_1234567890abcdefghijklmn''',
  '''representative_123456789''',
  # internal/platform/machine_binding_test.go pins the wire digest of the
  # machine binding (#1334): two SHA-256 hex strings that MUST stay exact, so
  # a change to the derivation re-keys every bound seat and goes red. They are
  # digests of synthetic inputs, not credentials; gitleaks reads any 64-hex
  # string next to "key" as a generic-api-key.
  '''938e44a9b13926f9da3b21203557da335705a46b13fd3d39fd0b3a745935dfe0''',
  '''ff41728112fa8992d3dcb21dfcbe66bf552359da6804b1a65d72f9af7f833743''',
]
