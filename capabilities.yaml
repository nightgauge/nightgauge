# Nightgauge capability registry.
#
# This is the ONE authored layer of the workspace knowledge graph (ADR-005,
# Decision 2). Everything else in the graph is derived; this file is written by
# hand and read by the machine.
#
# docs/CAPABILITIES_MAP.md is GENERATED from this file. Edit here, not there.
#
# Validation (internal/capabilities) refuses:
#   - an unknown status, disposition, or surface
#   - a `docs:` entry that does not exist
#   - an `owns:` glob that matches no tracked path  <- the anti-rot mechanism
#   - a `depends_on:` id that is not defined here
schema_version: 1

capabilities:
  - id: issue-to-pr-pipeline
    title: Issue-to-PR pipeline
    status: ga
    disposition: core
    surfaces: [skills, cli, sdk]
    docs: [docs/ISSUE_TO_PR_WORKFLOW.md, docs/PIPELINE_EXECUTION.md]
    owns:
      - skills/nightgauge-feature-*/**
      - skills/nightgauge-issue-*/**
      - skills/nightgauge-pr-*/**
      - internal/execution/**
    depends_on: [stage-gates, context-handoff, model-adapters]

  - id: stage-gates
    title: Deterministic stage gates
    status: ga
    disposition: core
    surfaces: [cli]
    docs: [docs/STAGE_GATES.md, docs/HOOK_CONTRACT.md]
    owns:
      - internal/hooks/**
      - internal/preflight/**
    depends_on: []

  - id: autonomous-scheduling
    title: Autonomous scheduling
    status: beta
    disposition: core
    surfaces: [cli]
    docs: [docs/AUTONOMOUS_ORCHESTRATOR.md]
    owns:
      - internal/orchestrator/**
      - internal/depgraph/**
    depends_on: [issue-to-pr-pipeline, guardrails-and-budgets, forge-abstraction]

  - id: context-handoff
    title: Context handoff between stages
    status: ga
    disposition: core
    surfaces: [sdk, cli]
    docs: [docs/CONTEXT_ARCHITECTURE.md]
    owns:
      - packages/nightgauge-sdk/src/context/**
      - internal/state/**
      - internal/runstate/**
    depends_on: []

  - id: knowledge-base
